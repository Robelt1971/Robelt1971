/* Layout: a dark presentation player (DERR-style navy and teal) around a fixed 1600x900 slide canvas scaled to fit. Single deliberate dark look. */
:root {

.stage { position: relative; width: 100%; overflow: hidden; border-radius: 10px; background: var(--navy); box-shadow: 0 10px 40px rgba(0,0,0,.45) }
.canvas { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0 }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between }
.group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.btn { font: 500 14px var(--sans); color: var(--chrome-fg); background: var(--chrome-2); border: 1px solid var(--chrome-line); border-radius: 8px; padding: 8px 14px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center }
.btn:hover { border-color: var(--teal) }

.btn:disabled { opacity: .4; cursor: default }
button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px }
.count { font: 500 14px var(--sans); font-variant-numeric: tabular-nums; color: var(--chrome-muted); min-width: 64px; text-align: center }
.progress { height: 4px; background: var(--chrome-line); border-radius: 2px; overflow: hidden }
.progress i { display: block; height: 100%; background: var(--teal); width: 0; transition: width .3s }
.notes { background: var(--chrome-2); border: 1px solid var(--chrome-line); border-radius: 10px; padding: 14px 18px; display: grid; gap: 6px }
.notes h2 { margin: 0; font: 600 12px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--teal) }
.notes p { margin: 0; max-width: 90ch; color: var(--chrome-fg); font-size: 15px }
.notes .warn { color: #f5c46b; font-size: 13px }
.player:fullscreen .notes { display: none }

/* ---------- slide canvas (fixed px, scaled as a whole) ---------- */
.slide { position: absolute; inset: 0; padding: 64px 80px 92px; display: flex; flex-direction: column; gap: 28px; font-family: var(--sans); animation: in .35s ease }
@keyframes in { from { opacity: .2 } to { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .slide { animation: none } .progress i { transition: none } }
.slide p, .slide h1, .slide h2, .slide h3, .slide ul { margin: 0 }
.light { background: var(--paper); color: var(--body) }
.dark { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%); color: #c9d6e8 }

.h1 { font: 600 70px/1.06 var(--serif); color: #f2f6fc; text-wrap: balance; max-width: 1300px }

/* 3 */ { k: "names", t: {
  en: { eb: "For the Minister to choose", title: "Twelve names, easy to say, about helping the community", foot: "Until a name is chosen, this presentation calls it “the Central Service”.", d: ["“Right to care”: recht means both justice and right.", "“Heart for justice”: care with a human face.", "“Justice close by”: help that comes to the community.", "“Justice support point”: one place to turn to.", "“House of care and justice”: one roof for all services.", "“The bridge”, also in Papiamento: justice, care and community.", "Formal government style (DZWJ).", "Papiamento: “Justice cares”.", "Papiamento: “hand in hand”, justice and community together.", "Centro de Orientación, Rehabilitación y Atención; echoes “corazón”.", "Justice Unified Support, Treatment & Assistance; “fair” in Spanish.", "Clear for international partners (JCA)."] },
  es: { eb: "Para que elija el Ministro", title: "Doce nombres fáciles de decir, centrados en ayudar a la comunidad", foot: "Mientras no se elija un nombre, esta presentación lo llama “el Servicio Central”.", d: ["“Derecho a cuidado”: recht es justicia y también derecho.", "“Corazón por la justicia”: cuidado con rostro humano.", "“Justicia cercana”: ayuda que llega a la comunidad.", "“Punto de apoyo de Justicia”: un solo lugar al que acudir.", "“Casa del cuidado y la justicia”: un techo para todo.", "“El puente”, igual en papiamento: justicia, cuidado y comunidad.", "Estilo formal de servicio del Gobierno (DZWJ).", "Papiamento: “la justicia cuida”.", "Papiamento: “mano a mano”, justicia y comunidad juntas.", "Centro de Orientación, Rehabilitación y Atención; evoca “corazón”.", "Sigla en inglés; en español, “justa”.", "Claro para socios internacionales (JCA)."] },
  nl: { eb: "Ter keuze van de Minister", title: "Twaalf namen, makkelijk uit te spreken, gericht op hulp aan de gemeenschap", foot: "Zolang er geen naam is, heet het in deze presentatie “de Centrale Dienst”.", d: ["Recht betekent hier justitie én aanspraak: iedereen heeft recht op zorg.", "Zorg met een menselijk gezicht, vanuit justitie.", "Hulp van justitie die naar de gemeenschap toe komt.", "Eén adres waar iedereen terecht kan.", "Eén huis voor alle diensten onder het dak.", "Tussen justitie, zorg en gemeenschap; ook Papiaments.", "Formele overheidsstijl (DZWJ).", "Papiaments: “Justitie zorgt”.", "Papiaments: “hand in hand”, justitie en gemeenschap samen.", "Centro de Orientación, Rehabilitación y Atención; doet denken aan “hart”.", "Engelse afkorting; Spaans voor “rechtvaardig”.", "Duidelijk voor internationale partners (JCA)."] },
  pap: { eb: "Pa Minister scoge", title: "Diesdos nomber fasil pa bisa, enfoca riba yudansa na comunidad", foot: "Te ora cu e nomber wordo scogi, e presentacion aki ta yam’e “e Servicio Central”.", d: ["“Derecho na cuido”: recht ta hustisia y tambe derecho.", "“Curason pa hustisia”: cuido cu un cara humano.", "“Hustisia cerca”: yudansa cu ta yega na comunidad.", "“Punto di apoyo di Hustisia”: un solo lugar pa bay.", "“Cas di cuido y hustisia”: un dak pa tur servicio.", "“E brug” entre hustisia, cuido y comunidad.", "Estilo formal di Gobierno (DZWJ).", "“Hustisia ta cuida”: di nos y fasil pa corda.", "Hustisia y comunidad huntu, man na man.", "Centro di Orientacion, Rehabilitacion y Atencion; ta corda “curason”.", "Sigla na Ingles; na Spaño “hustu”.", "Cla pa socionan internacional (JCA)."] } },
 n: {
  en: "Here are twelve options for the new name, most of them in Dutch, all short and easy to say. Recht op Zorg plays on the double meaning of recht: justice and right. Hart voor Recht and Justitie Dichtbij speak of a justice system that comes close to the community with a human face. Hustisia Cuida and Man na Man say the same in Papiamento. A short name can be combined with a formal subtitle. Until you choose, we call it the Central Service.",
  es: "Aquí hay doce opciones para el nombre nuevo, la mayoría en neerlandés, todas cortas y fáciles de decir. Recht op Zorg juega con el doble sentido de recht: justicia y derecho. Hart voor Recht y Justitie Dichtbij hablan de una justicia cercana a la comunidad, con rostro humano. Hustisia Cuida y Man na Man dicen lo mismo en papiamento. Un nombre corto puede ir con un subtítulo formal. Mientras usted no elija, lo llamamos el Servicio Central.",
  nl: "Hier ziet u twaalf opties voor de nieuwe naam, de meeste in het Nederlands, allemaal kort en makkelijk uit te spreken. Recht op Zorg speelt met de dubbele betekenis van recht. Hart voor Recht en Justitie Dichtbij staan voor een justitie die met een menselijk gezicht dicht bij de gemeenschap komt. Hustisia Cuida en Man na Man zeggen hetzelfde in het Papiaments. Een korte naam kan worden gecombineerd met een formele ondertitel. Tot u kiest, noemen we het de Centrale Dienst.",
  pap: "Aki tin diesdos opcion pa e nomber nobo, mayoria na Hulandes, tur cortico y fasil pa bisa. Recht op Zorg ta hunga cu e doble nificado di recht: hustisia y derecho. Hart voor Recht y Justitie Dichtbij ta papia di un hustisia cerca di comunidad, cu un cara humano. Hustisia Cuida y Man na Man ta bisa mescos na Papiamento. Un nomber cortico por bay cu un subtitulo formal. Te ora bo scoge, nos ta yam’e e Servicio Central." } },

/* 4 */ { k: "four", t: {
  en: { eb: "Structure", title: "Four services under one roof", sub: "Family Justice becomes the umbrella, under its new name", c: [["Central Medical Department", "Physicians, nurses, psychiatry, psychology, addiction care and orthopedagogy for every justice institution"], ["Slachtofferhulp", "Victim support, working side by side with the medical and psychological team"], ["Other professionals", "Family Justice staff and further disciplines [to define]"], ["Community Case Commission", "Analyzes problematic community cases and gives each one an individual route to the right care"]] },
  es: { eb: "Estructura", title: "Cuatro servicios bajo un mismo techo", sub: "Justicia Familiar pasa a ser el techo, con su nombre nuevo", c: [["Departamento Médico Central", "Médicos, enfermería, psiquiatría, psicología, adicciones y ortopedagogía para todas las instituciones de Justicia"], ["Slachtofferhulp", "Apoyo a las víctimas, junto al equipo médico y psicológico"], ["Otros profesionales", "Personal de Justicia Familiar y otras disciplinas [por definir]"], ["Comisión de Casos de la Comunidad", "Analiza los casos problemáticos de la comunidad y da a cada uno una ruta individual hacia la atención adecuada"]] },
  nl: { eb: "Structuur", title: "Vier diensten onder één dak", sub: "Familiejustitie wordt de overkoepelende afdeling, onder een nieuwe naam", c: [["Centrale Medische Dienst", "Artsen, verpleegkundigen, psychiatrie, psychologie, verslavingszorg en orthopedagogiek voor elke justitiële instelling"], ["Slachtofferhulp", "Hulp aan slachtoffers, zij aan zij met het medische en psychologische team"], ["Andere professionals", "Medewerkers van Familiejustitie en andere disciplines [nader te bepalen]"], ["Commissie Casussen uit de Gemeenschap", "Bespreekt complexe casussen uit de gemeenschap en geeft elke casus een eigen route naar de juiste zorg"]] },
  pap: { eb: "Structura", title: "Cuater servicio bou di un solo dak", sub: "Hustisia Familiar ta bira e dak, cu su nomber nobo", c: [["Departamento Medico Central", "Dokter, enfermera, psiquiatria, psicologia, cuido di adiccion y ortopedagogia pa tur institucion di Hustisia"], ["Slachtofferhulp", "Yudansa na victimanan, banda di e equipo medico y psicologico"], ["Otro profesional", "Personal di Hustisia Familiar y otro disciplina [pa defini]"], ["Comision di Casonan di Comunidad", "Ta analisa e casonan problematico di comunidad y ta duna cada un un ruta individual pa e cuido corecto"]] } },
 n: {
  en: "The umbrella holds four services. The medical department is the one this presentation details. Slachtofferhulp and the other professionals keep their current tasks, but now share one management and one commission with the medical team. The commission is the meeting point: it takes the hard cases from the community and from the institutions and decides who takes care of each one.",
  es: "El techo reúne cuatro servicios. El departamento médico es el que esta presentación detalla. Slachtofferhulp y los demás profesionales mantienen sus tareas, pero ahora comparten una dirección y una comisión con el equipo médico. La comisión es el punto de encuentro: recibe los casos difíciles de la comunidad y de las instituciones y decide quién se ocupa de cada uno.",
  nl: "Onder het dak vallen vier diensten. Deze presentatie gaat vooral over de medische dienst. Slachtofferhulp en de andere professionals houden hun huidige taken, maar delen nu één leiding en één commissie met het medische team. De commissie is het ontmoetingspunt: zij ontvangt de moeilijke casussen uit de gemeenschap en uit de instellingen en bepaalt wie voor elke casus zorgt.",
  pap: "Bou di e dak tin cuater servicio. E departamento medico ta esun cu e presentacion aki ta splica na detaye. Slachtofferhulp y e otro profesionalnan ta keda cu nan tareanan, pero awor nan ta parti un direccion y un comision cu e equipo medico. E comision ta e punto di encuentro: e ta ricibi e casonan dificil di comunidad y di e institucionnan y ta dicidi ken ta encarga di cada un." } },

 n: {
  en: "Read it from the top. The Minister, the director of the umbrella department, then the Head of the Central Medical Department, who directs the whole medical structure, not only the prison. The psychiatrist and the addiction therapist are central and serve all institutions. Below are the teams: three rotating physicians, fifteen nurses, seven mental health professionals, the secretary of the KIA office, the administration unit that runs budget, purchasing and personnel, and the external providers the department contracts. Thirty-one people, two of them in administration, all paid by the Central Service, plus the existing Slachtofferhulp team.",
  es: "Se lee de arriba hacia abajo. El Ministro, el director del departamento techo y luego el Jefe del Departamento Médico Central, que dirige toda la estructura médica, no solo la de la prisión. La psiquiatra y el terapeuta en adicciones son centrales y atienden a todas las instituciones. Abajo están los equipos: tres médicos que rotan, quince enfermeros, siete profesionales de salud mental, la secretaria de la oficina de KIA, la unidad de administración que lleva presupuesto, compras y personal, y los proveedores externos que contrata el departamento. Treinta y una personas, dos de ellas en administración, todas pagadas por el Servicio Central, más el equipo existente de Slachtofferhulp.",
  nl: "Lees van boven naar beneden. De Minister, de directeur van de overkoepelende afdeling en dan het hoofd van de Centrale Medische Dienst, die de hele medische organisatie leidt en niet alleen die van de gevangenis. De psychiater en de verslavingstherapeut zijn centraal en werken voor alle instellingen. Daaronder de teams: drie roulerende artsen, vijftien verpleegkundigen, zeven professionals in de geestelijke gezondheidszorg, de secretaresse van het kantoor in KIA, de afdeling administratie voor budget, inkoop en personeel, en de externe zorgverleners die de dienst inhuurt. Eenendertig mensen, van wie twee in de administratie, allemaal betaald door de Centrale Dienst, plus het bestaande team van Slachtofferhulp.",
  pap: "Ta lesa e di ariba pa abou. E Minister, e director di e departamento cu ta forma e dak, y despues e Hefe di Departamento Medico Central, cu ta dirigi henter e structura medico, no solamente esun di prizon. E psiquiatra y e terapista di adiccion ta central y ta atende tur institucion. Abou tin e equiponan: tres dokter cu ta rota, diescinco enfermera, shete profesional di salud mental, e secretaria di e oficina di KIA, e unidad di administracion cu ta maneha presupuesto, compra y personal, y e proveedornan di pafo cu e departamento ta contrata. Trinta-un persona, dos di nan den administracion, tur paga pa e Servicio Central, mas e equipo existente di Slachtofferhulp." } },

/* 6 */ { k: "served", t: {
  en: { eb: "Who we serve", title: "Four doors into one service", c: [["KIA / DGWA", "Prison", ["Medical post", "Forensic psychiatric unit", "Psychology, addiction care, orthopedagogy"]], ["KPA", "Police", ["Playa, Santa Cruz, Noord, San Nicolas", "Lands Recherche and Wayaca on request"]], ["GNC", "Guarda Nos Costa", ["Migrant intake", "Disease screening", "Pre-deportation clearance"]], ["NEW", "Other justice institutions", ["On request, when the case requires it", "Community cases via the commission"]]] },
  es: { eb: "A quién atendemos", title: "Cuatro puertas a un solo servicio", c: [["KIA / DGWA", "Prisión", ["Puesto médico", "Unidad psiquiátrica forense", "Psicología, adicciones, ortopedagogía"]], ["KPA", "Policía", ["Playa, Santa Cruz, Noord, San Nicolas", "Lands Recherche y Wayaca a pedido"]], ["GNC", "Guarda Nos Costa", ["Ingreso de migrantes", "Tamizaje de enfermedades", "Evaluación previa a la deportación"]], ["NUEVO", "Otras instituciones de Justicia", ["A pedido, cuando el caso lo amerite", "Casos de la comunidad por la comisión"]]] },
  nl: { eb: "Voor wie wij werken", title: "Vier ingangen naar één dienst", c: [["KIA / DGWA", "Gevangenis", ["Medische post", "Forensisch-psychiatrische afdeling", "Psychologie, verslavingszorg, orthopedagogiek"]], ["KPA", "Politie", ["Playa, Santa Cruz, Noord, San Nicolas", "Landsrecherche en Wayaca op verzoek"]], ["GNC", "Guarda Nos Costa", ["Intake van migranten", "Screening op infectieziekten", "Medische vrijgave vóór uitzetting"]], ["NIEUW", "Andere justitiële instellingen", ["Op verzoek, als de casus dat vraagt", "Casussen uit de gemeenschap via de commissie"]]] },
  pap: { eb: "Na ken nos ta atende", title: "Cuater porta pa un solo servicio", c: [["KIA / DGWA", "Prizon", ["Puesto medico", "Unidad psiquiatrico forense", "Psicologia, adiccion, ortopedagogia"]], ["KPA", "Polis", ["Playa, Santa Cruz, Noord, San Nicolas", "Lands Recherche y Wayaca riba peticion"]], ["GNC", "Guarda Nos Costa", ["Intake di migrante", "Screening di malesa", "Evaluacion promer cu deportacion"]], ["NOBO", "Otro institucion di Hustisia", ["Riba peticion, ora e caso mester", "Casonan di comunidad via e comision"]]] } },
 n: {
  en: "The service has four doors. The prison, with its medical post and the forensic psychiatric unit. The four police stations, with Lands Recherche and Wayaca on request. Guarda Nos Costa, with migrant intake and pre-deportation clearance. And a new door: any other justice institution can request support, and community cases enter through the commission. The model grows by adding people to one shared team, not by building new departments.",
  es: "El servicio tiene cuatro puertas. La prisión, con su puesto médico y la unidad psiquiátrica forense. Las cuatro estaciones de policía, con Lands Recherche y Wayaca a pedido. Guarda Nos Costa, con el ingreso de migrantes y la evaluación antes de la deportación. Y una puerta nueva: cualquier otra institución de Justicia puede pedir apoyo, y los casos de la comunidad entran por la comisión. El modelo crece sumando personas a un solo equipo, no creando departamentos nuevos.",
  nl: "De dienst heeft vier ingangen. De gevangenis, met de medische post en de forensisch-psychiatrische afdeling. De vier politiebureaus, met de Landsrecherche en Wayaca op verzoek. Guarda Nos Costa, met de intake van migranten en de medische vrijgave vóór uitzetting. En een nieuwe ingang: elke andere justitiële instelling kan steun vragen, en casussen uit de gemeenschap komen binnen via de commissie. Het model groeit door mensen aan één gedeeld team toe te voegen, niet door nieuwe afdelingen te bouwen.",
  pap: "E servicio tin cuater porta. E prizon, cu su puesto medico y e unidad psiquiatrico forense. E cuater estacion di polis, cu Lands Recherche y Wayaca riba peticion. Guarda Nos Costa, cu e intake di migrante y e evaluacion promer cu deportacion. Y un porta nobo: cualkier otro institucion di Hustisia por pidi apoyo, y e casonan di comunidad ta drenta via e comision. E modelo ta crece ora nos agrega hende na un solo equipo, no ora nos traha departamento nobo." } },

{ k: "contacts", t: {
  en: { eb: "Contact persons", title: "A contact person and a deputy in every institution", role: "Contact person + deputy", c: [["KIA / DGWA", "Medical post, forensic unit, access and security"], ["KPA", "Stations, cars, fuel vouchers, detainee transport"], ["GNC", "Intake, interpreters, deportation planning"], ["Other institutions", "Named when the institution joins the service"]], d: ["One person to call when a process is not flowing", "Solves problems with access, transport, equipment, medication and vouchers", "Meets the Head of the Medical Department every month", "The deputy always covers leave and absence"], band: "The Central Service has its own: the Head of the Medical Department, with a deputy. Names and phone numbers go into each MoU and the administration keeps them up to date." },
  es: { eb: "Personas de contacto", title: "Una persona de contacto y un suplente en cada institución", role: "Contacto + suplente", c: [["KIA / DGWA", "Puesto médico, unidad forense, acceso y seguridad"], ["KPA", "Estaciones, autos, bonos de gasolina, traslados de detenidos"], ["GNC", "Ingresos, intérpretes, planificación de deportaciones"], ["Otras instituciones", "Se designan al sumarse al servicio"]], d: ["Una sola persona a quien llamar cuando un proceso no fluye", "Resuelve problemas de acceso, transporte, equipos, medicamentos y bonos", "Se reúne cada mes con el Jefe del Departamento Médico", "El suplente cubre siempre vacaciones y ausencias"], band: "El Servicio Central también tiene el suyo: el Jefe del Departamento Médico, con un suplente. Nombres y teléfonos van en cada MoU y la administración los mantiene al día." },
  nl: { eb: "Contactpersonen", title: "Een contactpersoon en een vervanger in elke instelling", role: "Contactpersoon + vervanger", c: [["KIA / DGWA", "Medische post, forensische afdeling, toegang en beveiliging"], ["KPA", "Bureaus, auto's, brandstofbonnen, vervoer van gedetineerden"], ["GNC", "Intake, tolken, planning van uitzettingen"], ["Andere instellingen", "Aangewezen bij aansluiting op de dienst"]], d: ["Eén persoon om te bellen als een proces vastloopt", "Lost problemen op met toegang, vervoer, apparatuur, medicatie en bonnen", "Overlegt elke maand met het hoofd van de Medische Dienst", "De vervanger neemt altijd over bij verlof en afwezigheid"], band: "De Centrale Dienst heeft er ook een: het hoofd van de Medische Dienst, met een vervanger. Namen en telefoonnummers staan in elke MoU en de administratie houdt ze actueel." },
  pap: { eb: "Persona di contacto", title: "Un persona di contacto y un suplente den cada institucion", role: "Contacto + suplente", c: [["KIA / DGWA", "Puesto medico, unidad forense, acceso y seguridad"], ["KPA", "Estacion, auto, bono di gasolin, traslado di detenido"], ["GNC", "Intake, interprete, planificacion di deportacion"], ["Otro institucion", "Ta wordo designa ora nan uni na e servicio"]], d: ["Un solo persona pa yama ora un proceso no ta corre", "Ta resolve problema di acceso, transporte, aparato, remedi y bono", "Ta reuni tur luna cu e Hefe di Departamento Medico", "E suplente semper ta cubri vacacion y ausencia"], band: "E Servicio Central tambe tin esun propio: e Hefe di Departamento Medico, cu un suplente. Nomber y number di telefon ta den cada MoU y administracion ta tene nan al dia." } },
 n: {
  en: "Every institution names one contact person and a deputy. When a process is not flowing, for example access to a cell, a vehicle, equipment, medication or the weekly fuel vouchers, the Central Service knows exactly whom to call, and the deputy covers leave and absence. They meet the Head of the Medical Department every month. The Central Service does the same on its side. Names and phone numbers are written into each agreement and kept up to date by the administration.",
  es: "Cada institución designa una persona de contacto y un suplente. Cuando un proceso no fluye, por ejemplo el acceso a una celda, un vehículo, un equipo, los medicamentos o los bonos de gasolina semanales, el Servicio Central sabe exactamente a quién llamar, y el suplente cubre vacaciones y ausencias. Se reúnen cada mes con el Jefe del Departamento Médico. El Servicio Central hace lo mismo por su parte. Los nombres y teléfonos se escriben en cada acuerdo y la administración los mantiene al día.",
  nl: "Elke instelling wijst één contactpersoon en een vervanger aan. Als een proces vastloopt, bijvoorbeeld de toegang tot een cel, een voertuig, apparatuur, medicatie of de wekelijkse brandstofbonnen, weet de Centrale Dienst precies wie te bellen, en de vervanger neemt over bij verlof en afwezigheid. Zij overleggen elke maand met het hoofd van de Medische Dienst. De Centrale Dienst doet hetzelfde aan haar kant. Namen en telefoonnummers staan in elke overeenkomst en de administratie houdt ze actueel.",
  pap: "Cada institucion ta designa un persona di contacto y un suplente. Ora un proceso no ta corre, por ehempel e acceso na un sel, un vehiculo, un aparato, remedi of e bononan di gasolin semanal, e Servicio Central sa exactamente na ken pa yama, y e suplente ta cubri vacacion y ausencia. Nan ta reuni tur luna cu e Hefe di Departamento Medico. E Servicio Central ta haci mescos di su banda. E nombernan y numbernan di telefon ta skirbi den cada acuerdo y administracion ta tene nan al dia." } },

 n: {
  en: "Today the team has nine people, counting the psychiatrist who is already being appointed: the Head, one physician, three nurses, two psychologists, the secretary and the psychiatrist. To cover every site we need twenty-nine health staff and two people in administration: thirty-one in total, with twenty-two new positions. The two physicians are already identified, live in Aruba and are willing to work for the Ministry. The existing Slachtofferhulp team is also part of the service: they are government employees already in place, so they move under the umbrella as they are and need no new budget.",
  es: "Hoy el equipo tiene nueve personas, contando a la psiquiatra que ya está en proceso de nombramiento: el jefe, un médico, tres enfermeros, dos psicólogos, la secretaria y la psiquiatra. Para cubrir todos los sitios necesitamos veintinueve personas de salud y dos de administración: treinta y una en total, con veintidós plazas nuevas. Los dos médicos ya están identificados, viven en Aruba y están dispuestos a trabajar para el Ministerio. El equipo existente de Slachtofferhulp también forma parte del servicio: son trabajadores del Gobierno que ya existen, así que pasan bajo el techo tal como están y no necesitan presupuesto nuevo.",
  nl: "Vandaag telt het team negen mensen, inclusief de psychiater die al wordt benoemd: het hoofd, één arts, drie verpleegkundigen, twee psychologen, de secretaresse en de psychiater. Om alle locaties te dekken zijn er negenentwintig zorgmedewerkers en twee administratieve medewerkers nodig: eenendertig in totaal, met tweeëntwintig nieuwe functies. De twee artsen zijn al gevonden, wonen op Aruba en willen voor het ministerie werken. Het bestaande team van Slachtofferhulp hoort ook bij de dienst: het zijn bestaande overheidsmedewerkers, dus zij gaan onder het dak zoals ze nu zijn en vragen geen nieuw budget.",
  pap: "Awe e equipo tin nuebe persona, contando e psiquiatra cu ta den proceso di nombramento: e hefe, un dokter, tres enfermera, dos psicologo, e secretaria y e psiquiatra. Pa cubri tur sitio nos mester di binti-nuebe persona di salud y dos di administracion: trinta-un en total, cu binti-dos puesto nobo. E dos doktornan ya ta identifica, ta biba na Aruba y ta dispuesto pa traha pa Ministerio. E equipo existente di Slachtofferhulp tambe ta parti di e servicio: nan ta trahado di Gobierno cu ta existi caba, p'esey nan ta pasa bou di e dak manera nan ta y no ta rekeri presupuesto nobo." } },

  pap: { eb: "Pa cuminsa e proyecto", h: "puesto nobo", sub: "31 persona paga pa e Servicio Central, mas e equipo existente di Slachtofferhulp", s: [["12", "enfermera", "7 forense · 3 KPA/GNC · 2 KIA"], ["4", "psicologo", "2 KIA · 2 pafo"], ["2", "dokter", "ya identifica na Aruba"], ["1", "terapista di adiccion", "central, KIA 3 dia pa siman"], ["1", "ortopedagogo", "TBS of unidad forense"], ["2", "administracion", "presupuesto, compra, RRHH"]] } },
 n: {
  en: "The headline number: twenty-two new positions. More than half are nurses, and seven of them are for the forensic psychiatric unit at KIA, which today has no dedicated nursing. One addiction therapist and one orthopedagogue complete the mental health team. Two administrative staff run the budget, purchasing and personnel. The two physicians can start as soon as you sign.",
  es: "La cifra clave: veintidós plazas nuevas. Más de la mitad son de enfermería, y siete son para la unidad psiquiátrica forense de KIA, que hoy no tiene enfermería propia. Un terapeuta en adicciones y un ortopedagogo completan el equipo de salud mental. Dos personas de administración llevan el presupuesto, las compras y el personal. Los dos médicos pueden empezar en cuanto usted firme.",
  nl: "Het kerngetal: tweeëntwintig nieuwe functies. Meer dan de helft zijn verpleegkundigen, en zeven daarvan zijn voor de forensisch-psychiatrische afdeling van KIA, die nu geen eigen verpleging heeft. Een verslavingstherapeut en een orthopedagoog maken het team voor geestelijke gezondheid compleet. Twee administratieve medewerkers regelen budget, inkoop en personeel. De twee artsen kunnen beginnen zodra u tekent.",
  pap: "E cifra principal: binti-dos puesto nobo. Mas di mitar ta enfermera, y shete di nan ta pa e unidad psiquiatrico forense di KIA, cu awe no tin enfermeria propio. Un terapista di adiccion y un ortopedagogo ta completa e equipo di salud mental. Dos persona di administracion ta maneha presupuesto, compra y personal. E dos doktornan por cuminsa mesora cu bo firma." } },

/* 9 */ { k: "roles", t: {
  en: { eb: "Who stays, who moves", title: "Fixed teams, rotating physicians, central leadership", c: [["Fixed at KIA", "Do not rotate", ["5 nurses, medical post", "7 nurses, forensic unit", "4 psychologists", "Orthopedagogue, TBS or forensic unit", "Secretary, KIA office"]], ["Rotating", "All sites", ["3 attending physicians", "Rotate KIA, KPA, GNC", "Take turns on the weekly on-call"]], ["External base", "Outside KIA", ["3 nurses, KPA and GNC", "2 external psychologists", "KIA nursing backs them up, and the reverse"]], ["Central", "Move to work and supervise", ["Head of the department", "Psychiatrist", "Addiction therapist, KIA 3 days a week"]]], band: "On call every week, each with an on-call phone: one physician, one nurse, one psychologist and the psychiatrist. Not on call: the addiction therapist and the orthopedagogue." },
  es: { eb: "Quién se queda, quién se mueve", title: "Equipos fijos, médicos que rotan, dirección central", c: [["Fijos en KIA", "No rotan", ["5 enfermeros, puesto médico", "7 enfermeros, unidad forense", "4 psicólogos", "Ortopedagogo, TBS o unidad forense", "Secretaria, oficina de KIA"]], ["Rotan", "Todos los sitios", ["3 médicos asistenciales", "Rotan por KIA, KPA, GNC", "Se turnan la guardia semanal"]], ["Base externa", "Fuera de KIA", ["3 enfermeros, KPA y GNC", "2 psicólogos externos", "Enfermería de KIA los apoya, y al revés"]], ["Central", "Se mueven para trabajar y supervisar", ["Jefe del departamento", "Psiquiatra", "Terapeuta en adicciones, KIA 3 días por semana"]]], band: "De guardia cada semana, cada uno con su teléfono: un médico, un enfermero, un psicólogo y la psiquiatra. Sin guardia: el terapeuta en adicciones y el ortopedagogo." },
  nl: { eb: "Wie blijft, wie beweegt", title: "Vaste teams, roulerende artsen, centrale leiding", c: [["Vast in KIA", "Rouleren niet", ["5 verpleegkundigen, medische post", "7 verpleegkundigen, forensische afdeling", "4 psychologen", "Orthopedagoog, TBS of forensische afdeling", "Secretaresse, kantoor KIA"]], ["Roulerend", "Alle locaties", ["3 artsen", "Rouleren over KIA, KPA, GNC", "Wisselen de wekelijkse bereikbaarheidsdienst af"]], ["Externe basis", "Buiten KIA", ["3 verpleegkundigen, KPA en GNC", "2 externe psychologen", "De verpleging van KIA springt bij, en omgekeerd"]], ["Centraal", "Op pad om te werken en toezicht te houden", ["Hoofd van de dienst", "Psychiater", "Verslavingstherapeut, 3 dagen per week KIA"]]], band: "Elke week bereikbaar, ieder met een eigen dienstelefoon: één arts, één verpleegkundige, één psycholoog en de psychiater. Geen bereikbaarheidsdienst: de verslavingstherapeut en de orthopedagoog." },
  pap: { eb: "Ken ta keda, ken ta move", title: "Equipo fiho, dokter cu ta rota, direccion central", c: [["Fiho na KIA", "No ta rota", ["5 enfermera, puesto medico", "7 enfermera, unidad forense", "4 psicologo", "Ortopedagogo, TBS of unidad forense", "Secretaria, oficina di KIA"]], ["Ta rota", "Tur sitio", ["3 dokter", "Ta rota na KIA, KPA, GNC", "Ta turna e guardia semanal"]], ["Base di pafo", "Pafo di KIA", ["3 enfermera, KPA y GNC", "2 psicologo di pafo", "Enfermeria di KIA ta yuda nan, y biceversa"]], ["Central", "Ta move pa traha y supervisa", ["Hefe di departamento", "Psiquiatra", "Terapista di adiccion, KIA 3 dia pa siman"]]], band: "Di guardia cada siman, cada un cu su telefon: un dokter, un enfermera, un psicologo y e psiquiatra. Sin guardia: e terapista di adiccion y e ortopedagogo." } },
 n: {
  en: "Four groups. The KIA teams are fixed, because continuity matters inside the prison and in the forensic unit. The orthopedagogue works with the TBS group, or in the KIA forensic unit as long as there is no TBS. The physicians are the mobile clinical resource and rotate across all sites. The external nurses stay outside, with KIA nursing as backup. The Head, the psychiatrist and the addiction therapist are central; the addiction therapist spends three days a week at KIA. Every week one physician, one nurse, one psychologist and the psychiatrist are on call, each with an on-call phone. The addiction therapist and the orthopedagogue do not do on-call duty.",
  es: "Cuatro grupos. Los equipos de KIA son fijos, porque la continuidad importa dentro de la prisión y en la unidad forense. El ortopedagogo trabaja con el grupo TBS, o en la unidad forense de KIA mientras no exista un TBS. Los médicos son el recurso clínico móvil y rotan por todos los sitios. Los enfermeros externos se quedan afuera, con el apoyo de la enfermería de KIA. El jefe, la psiquiatra y el terapeuta en adicciones son centrales; el terapeuta pasa tres días por semana en KIA. Cada semana hay un médico, un enfermero, un psicólogo y la psiquiatra de guardia, cada uno con su teléfono. El terapeuta en adicciones y el ortopedagogo no hacen guardias.",
  nl: "Vier groepen. De teams in KIA zijn vast, omdat continuïteit telt in de gevangenis en op de forensische afdeling. De orthopedagoog werkt met de TBS-groep, of op de forensische afdeling van KIA zolang er geen TBS is. De artsen zijn de mobiele medische capaciteit en rouleren over alle locaties. De externe verpleegkundigen blijven buiten, met de verpleging van KIA als achtervang. Het hoofd, de psychiater en de verslavingstherapeut zijn centraal; de verslavingstherapeut is drie dagen per week in KIA. Elke week zijn één arts, één verpleegkundige, één psycholoog en de psychiater bereikbaar, ieder met een eigen dienstelefoon. De verslavingstherapeut en de orthopedagoog hebben geen bereikbaarheidsdienst.",
  pap: "Cuater grupo. E equiponan di KIA ta fiho, pasobra continuidad ta importante den prizon y den e unidad forense. E ortopedagogo ta traha cu e grupo di TBS, of den e unidad forense di KIA mientras cu no tin TBS. E doktornan ta e recurso clinico movil y ta rota na tur sitio. E enfermeranan di pafo ta keda pafo, cu apoyo di enfermeria di KIA. E hefe, e psiquiatra y e terapista di adiccion ta central; e terapista ta pasa tres dia pa siman na KIA. Cada siman tin un dokter, un enfermera, un psicologo y e psiquiatra di guardia, cada un cu su telefon. E terapista di adiccion y e ortopedagogo no ta haci guardia." } },
