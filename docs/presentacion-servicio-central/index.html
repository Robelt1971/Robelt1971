 n: {
  en: "This is the daily picture. Inside KIA two physicians are present: one for the medical post and one for the forensic unit, which the psychiatrist also visits on a fixed schedule, and where the orthopedagogue works. The addiction therapist is at KIA three days a week. Outside, the third physician runs the circuit of the four police stations and Guarda Nos Costa. Two nurses split the stations into North and South, and the third nurse is at Guarda Nos Costa. After four in the afternoon, at weekends and on holidays, one physician, one nurse and one psychologist are on call for the whole system, and the psychiatrist can be reached by phone.",
  es: "Este es el panorama diario. Dentro de KIA hay dos médicos: uno para el puesto médico y otro para la unidad forense, que la psiquiatra visita con un horario fijo y donde trabaja el ortopedagogo. El terapeuta en adicciones está en KIA tres días por semana. Afuera, el tercer médico recorre las cuatro estaciones de policía y Guarda Nos Costa. Dos enfermeros se dividen las estaciones en Norte y Sur, y el tercero está en Guarda Nos Costa. Después de las cuatro de la tarde, los fines de semana y los feriados, hay un médico, un enfermero y un psicólogo de guardia para todo el sistema, y la psiquiatra está disponible por teléfono.",
  nl: "Dit is het dagelijkse beeld. In KIA zijn twee artsen aanwezig: één voor de medische post en één voor de forensische afdeling, waar de psychiater volgens een vast rooster komt en de orthopedagoog werkt. De verslavingstherapeut is drie dagen per week in KIA. Buiten rijdt de derde arts de route langs de vier politiebureaus en Guarda Nos Costa. Twee verpleegkundigen verdelen de bureaus in Noord en Zuid, de derde werkt bij Guarda Nos Costa. Na vier uur 's middags, in het weekend en op feestdagen zijn één arts, één verpleegkundige en één psycholoog bereikbaar voor het hele systeem, en is de psychiater telefonisch bereikbaar.",
  pap: "Esaki ta e bista di tur dia. Den KIA tin dos dokter: un pa e puesto medico y un pa e unidad forense, unda e psiquiatra ta bishita cu un orario fiho y unda e ortopedagogo ta traha. E terapista di adiccion ta na KIA tres dia pa siman. Pafo, e di tres dokter ta haci e circuito di e cuater estacion di polis y Guarda Nos Costa. Dos enfermera ta parti e estacionnan den Noord y Zuid, y e di tres ta na Guarda Nos Costa. Despues di cuater or di atardi, den fin di siman y dia di fiesta, tin un dokter, un enfermera y un psicologo di guardia pa henter e sistema, y e psiquiatra ta disponibel pa telefon." } },

/* 11 */ { k: "table", center: [1, 2, 3], w: [37, 21, 21, 21], t: {
  en: { eb: "Rotation", title: "A three-week cycle for physicians and on-call", h: ["Position", "Week 1", "Week 2", "Week 3"], r: [["KIA medical post", "Dr. A", "Dr. B", "Dr. C"], ["KIA forensic unit", "Dr. B", "Dr. C", "Dr. A"], ["External circuit + on-call", "Dr. C", "Dr. A", "Dr. B"], ["On-call nurse, KPA/GNC", "Nurse 1", "Nurse 2", "Nurse 3"], ["On-call psychologist", "Psych. 1", "Psych. 2", "Psych. 3"], ["Psychiatrist, by phone", "Psychiatrist", "Psychiatrist", "Psychiatrist"]], chips: ["Each physician is on call one week in three", "4 on-call phones: physician, nurse, psychologist, psychiatrist", "Any physician covers any site during absences"], foot: "Example roster. The psychologists’ on-call rotation is defined with the team. KIA posts can rotate monthly for continuity." },
  es: { eb: "Rotación", title: "Un ciclo de tres semanas para médicos y guardias", h: ["Puesto", "Semana 1", "Semana 2", "Semana 3"], r: [["Puesto médico KIA", "Dr. A", "Dr. B", "Dr. C"], ["Unidad forense KIA", "Dr. B", "Dr. C", "Dr. A"], ["Circuito externo + guardia", "Dr. C", "Dr. A", "Dr. B"], ["Enfermero de guardia, KPA/GNC", "Enfermero 1", "Enfermero 2", "Enfermero 3"], ["Psicólogo de guardia", "Psicólogo 1", "Psicólogo 2", "Psicólogo 3"], ["Psiquiatra, por teléfono", "Psiquiatra", "Psiquiatra", "Psiquiatra"]], chips: ["Cada médico está de guardia una semana de cada tres", "4 teléfonos de guardia: médico, enfermero, psicólogo, psiquiatra", "Cualquier médico cubre cualquier sitio en ausencias"], foot: "Rol de ejemplo. La rotación de guardia de los psicólogos se define con el equipo. Los puestos en KIA pueden rotar mensualmente por continuidad." },
  nl: { eb: "Rotatie", title: "Een cyclus van drie weken voor artsen en bereikbaarheid", h: ["Positie", "Week 1", "Week 2", "Week 3"], r: [["Medische post KIA", "Dr. A", "Dr. B", "Dr. C"], ["Forensische afdeling KIA", "Dr. B", "Dr. C", "Dr. A"], ["Externe route + bereikbaarheid", "Dr. C", "Dr. A", "Dr. B"], ["Verpleegkundige van dienst, KPA/GNC", "Verpl. 1", "Verpl. 2", "Verpl. 3"], ["Psycholoog van dienst", "Psych. 1", "Psych. 2", "Psych. 3"], ["Psychiater, telefonisch", "Psychiater", "Psychiater", "Psychiater"]], chips: ["Elke arts is één week op de drie bereikbaar", "4 dienstelefoons: arts, verpleegkundige, psycholoog, psychiater", "Elke arts neemt bij afwezigheid elke locatie over"], foot: "Voorbeeldrooster. De bereikbaarheid van de psychologen wordt met het team vastgesteld. Posities in KIA kunnen maandelijks rouleren voor de continuïteit." },
  pap: { eb: "Rotacion", title: "Un ciclo di tres siman pa dokter y guardia", h: ["Puesto", "Siman 1", "Siman 2", "Siman 3"], r: [["Puesto medico KIA", "Dr. A", "Dr. B", "Dr. C"], ["Unidad forense KIA", "Dr. B", "Dr. C", "Dr. A"], ["Circuito di pafo + guardia", "Dr. C", "Dr. A", "Dr. B"], ["Enfermera di guardia, KPA/GNC", "Enfermera 1", "Enfermera 2", "Enfermera 3"], ["Psicologo di guardia", "Psicologo 1", "Psicologo 2", "Psicologo 3"], ["Psiquiatra, pa telefon", "Psiquiatra", "Psiquiatra", "Psiquiatra"]], chips: ["Cada dokter ta di guardia un siman di cada tres", "4 telefon di guardia: dokter, enfermera, psicologo, psiquiatra", "Cualkier dokter ta cubri cualkier sitio ora tin ausencia"], foot: "Rol di ehempel. E rotacion di guardia di e psicologonan ta wordo defini cu e equipo. E puestonan na KIA por rota pa luna pa continuidad." } },
 n: {
  en: "A simple, predictable cycle. Every week one physician runs the external circuit and carries the on-call phone for the whole system, while the other two work inside KIA. One of the three external nurses is the on-call nurse of the week, and one psychologist is on call for crises such as suicide risk. The on-call physician and nurse use the two police cars; the on-call psychologist uses a car of the Central Service. Because all three physicians know every site, an absence never closes a service. Each on-call role has its own phone: physician, nurse, psychologist and psychiatrist.",
  es: "Un ciclo simple y previsible. Cada semana un médico hace el circuito externo y lleva el teléfono de guardia de todo el sistema, mientras los otros dos trabajan dentro de KIA. Uno de los tres enfermeros externos es el enfermero de guardia de la semana, y un psicólogo está de guardia para crisis como el riesgo de suicidio. El médico y el enfermero de guardia usan los dos autos de la policía; el psicólogo de guardia usa un auto del Servicio Central. Como los tres médicos conocen todos los sitios, una ausencia nunca cierra un servicio. Cada guardia tiene su propio teléfono: médico, enfermero, psicólogo y psiquiatra.",
  nl: "Een eenvoudige, voorspelbare cyclus. Elke week rijdt één arts de externe route en draagt de telefoon van de bereikbaarheidsdienst voor het hele systeem, terwijl de andere twee in KIA werken. Eén van de drie externe verpleegkundigen is die week van dienst, en één psycholoog is bereikbaar voor crises zoals suïciderisico. De arts en verpleegkundige van dienst gebruiken de twee politieauto's; de psycholoog van dienst gebruikt een auto van de Centrale Dienst. Omdat alle drie de artsen elke locatie kennen, sluit een afwezigheid nooit een dienst. Elke dienst heeft een eigen telefoon: arts, verpleegkundige, psycholoog en psychiater.",
  pap: "Un ciclo simpel y previsibel. Cada siman un dokter ta haci e circuito di pafo y ta carga e telefon di guardia pa henter e sistema, mientras e otro dos ta traha den KIA. Un di e tres enfermeranan di pafo ta e enfermera di guardia di e siman, y un psicologo ta di guardia pa crisis manera riesgo di suicidio. E dokter y e enfermera di guardia ta usa e dos auto di polis; e psicologo di guardia ta usa un auto di e Servicio Central. Como cu e tres doktornan ta conoce tur sitio, un ausencia nunca ta sera un servicio. Cada guardia tin su mes telefon: dokter, enfermera, psicologo y psiquiatra." } },

/* 12 */ { k: "options", t: {
  en: { eb: "Psychiatric detainees", title: "No TBS in Aruba: two options for proper care", A: ["Option A · best practice", "A forensic care institution", ["Similar to the Dutch TBS clinics, outside the prison", "Forensic psychiatrists, psychologists and nurses", "Needs its own budget, building and specialists", "Start with a feasibility study"]], B: ["Option B · achievable now", "Reinforce the unit inside KIA", ["7 nurses covering 24 hours, day and night", "Day 07–15: 2 nurses · evening 15–23: 1 · night 23–07: 1", "Every nurse rotates through day and night shifts: a condition of the contract", "KIA psychologists: therapy, risk assessment and crisis support", "Daily physician, psychiatrist by schedule, orthopedagogue"]], band: "<b>The math:</b> 28 shifts a week to fill (14 day, 7 evening, 7 night); 7 nurses give 35, leaving 20% for leave, sickness and training. Two nurses on every shift later would need about 3–4 more nurses.", foot: "Assumes 5 shifts of 8 hours per nurse per week [to confirm with HR rules]." },
  es: { eb: "Detenidos psiquiátricos", title: "Sin TBS en Aruba: dos opciones para un cuidado adecuado", A: ["Opción A · mejor práctica", "Una institución de cuidado forense", ["Similar a las clínicas TBS de Holanda, fuera de la prisión", "Psiquiatras, psicólogos y enfermeros forenses", "Necesita presupuesto, edificio y especialistas propios", "Empezar con un estudio de factibilidad"]], B: ["Opción B · posible ya", "Reforzar la unidad dentro de KIA", ["7 enfermeros que cubren las 24 horas, de día y de noche", "Día 07–15: 2 enfermeros · tarde 15–23: 1 · noche 23–07: 1", "Todos rotan por turnos de día y de noche: es condición del contrato", "Psicólogos de KIA: terapia, evaluación de riesgo y apoyo en crisis", "Médico diario, psiquiatra por horario, ortopedagogo"]], band: "<b>Las cuentas:</b> hay 28 turnos por semana (14 de día, 7 de tarde, 7 de noche); 7 enfermeros dan 35, con un 20 % de reserva para vacaciones, enfermedad y formación. Tener 2 enfermeros en cada turno más adelante requeriría unos 3 a 4 enfermeros más.", foot: "Supone 5 turnos de 8 horas por enfermero a la semana [confirmar con RR. HH.]." },
  nl: { eb: "Psychiatrische gedetineerden", title: "Geen TBS op Aruba: twee opties voor goede zorg", A: ["Optie A · beste praktijk", "Een forensische zorginstelling", ["Vergelijkbaar met de Nederlandse tbs-klinieken, buiten de gevangenis", "Forensisch psychiaters, psychologen en verpleegkundigen", "Vraagt eigen budget, gebouw en specialisten", "Beginnen met een haalbaarheidsstudie"]], B: ["Optie B · nu haalbaar", "De afdeling in KIA versterken", ["7 verpleegkundigen, 24 uur per dag, dag en nacht", "Dag 07–15: 2 verpleegkundigen · avond 15–23: 1 · nacht 23–07: 1", "Iedereen draait dag- én nachtdiensten: voorwaarde in het contract", "Psychologen KIA: therapie, risicotaxatie en crisisopvang", "Dagelijks een arts, psychiater volgens rooster, orthopedagoog"]], band: "<b>De rekensom:</b> 28 diensten per week (14 dag, 7 avond, 7 nacht); 7 verpleegkundigen leveren er 35, met 20% ruimte voor verlof, ziekte en scholing. Later 2 verpleegkundigen in elke dienst vraagt ongeveer 3 tot 4 verpleegkundigen extra.", foot: "Uitgaande van 5 diensten van 8 uur per verpleegkundige per week [te bevestigen met P&O]." },
  pap: { eb: "Detenido psiquiatrico", title: "Sin TBS na Aruba: dos opcion pa un bon cuido", A: ["Opcion A · mihor practica", "Un institucion di cuido forense", ["Parecido na e clinicanan TBS di Hulanda, pafo di prizon", "Psiquiatra, psicologo y enfermera forense", "Mester di su mes presupuesto, edificio y especialista", "Cuminsa cu un studio di factibilidad"]], B: ["Opcion B · posibel awor", "Reforsa e unidad den KIA", ["7 enfermera cu ta cubri 24 ora, di dia y di anochi", "Dia 07–15: 2 enfermera · atardi 15–23: 1 · anochi 23–07: 1", "Tur ta rota den turno di dia y di anochi: ta condicion di e contrato", "Psicologo di KIA: terapia, evaluacion di riesgo y apoyo den crisis", "Dokter tur dia, psiquiatra segun orario, ortopedagogo"]], band: "<b>E cuenta:</b> tin 28 turno pa siman (14 di dia, 7 di atardi, 7 di anochi); 7 enfermera ta duna 35, cu 20% di reserva pa vacacion, malesa y formacion. Pa tin 2 enfermera den cada turno despues, lo mester di mas o menos 3 pa 4 enfermera mas.", foot: "Ta supone 5 turno di 8 ora pa enfermera pa siman [confirma cu Recurso Humano]." } },
 n: {
  en: "Aruba has no TBS institution, so detainees with serious psychiatric disorders stay in the prison. The best solution is a dedicated forensic care institution, but it needs budget and specialists we may not have yet. The realistic step now is to reinforce the existing unit inside KIA with seven nurses who cover all twenty-four hours, day and night, together with the physician, the psychiatrist, the orthopedagogue and the KIA psychologists, who carry the therapy, the risk assessments and the crisis support. Every one of the seven nurses works both day and night shifts; that is a condition of the contract. By day there are two nurses, in the evening and at night one. Both options can run together: option B now, while option A is studied.",
  es: "Aruba no tiene una institución TBS, así que los detenidos con trastornos psiquiátricos graves permanecen en la prisión. La mejor solución es una institución de cuidado forense, pero requiere presupuesto y especialistas que quizás aún no tenemos. El paso realista ahora es reforzar la unidad que ya existe en KIA con siete enfermeros que cubren las veinticuatro horas, de día y de noche, junto al médico, la psiquiatra, el ortopedagogo y los psicólogos de KIA, que llevan la terapia, las evaluaciones de riesgo y el apoyo en crisis. Cada uno de los siete enfermeros hace turnos de día y también de noche; es una condición del contrato. De día hay dos enfermeros, por la tarde y por la noche uno. Las dos opciones pueden ir juntas: la B ahora, mientras se estudia la A.",
  nl: "Aruba heeft geen tbs-instelling, dus gedetineerden met ernstige psychiatrische stoornissen blijven in de gevangenis. De beste oplossing is een eigen forensische zorginstelling, maar die vraagt budget en specialisten die we misschien nog niet hebben. De realistische stap nu is de bestaande afdeling in KIA te versterken met zeven verpleegkundigen die de hele dag en nacht dekken, samen met de arts, de psychiater, de orthopedagoog en de psychologen van KIA, die de therapie, de risicotaxatie en de crisisopvang verzorgen. Elk van de zeven verpleegkundigen draait zowel dag- als nachtdiensten; dat is een voorwaarde in het contract. Overdag zijn er twee verpleegkundigen, 's avonds en 's nachts één. Beide opties kunnen samen: nu optie B, terwijl optie A wordt onderzocht.",
  pap: "Aruba no tin un institucion TBS, p'esey e detenidonan cu trastorno psiquiatrico serio ta keda den prizon. E mihor solucion ta un institucion di cuido forense, pero e ta rekeri presupuesto y especialista cu kisas nos no tin ainda. E paso realista awor ta pa reforsa e unidad cu ya ta existi na KIA cu shete enfermera cu ta cubri e binti-cuater oranan, di dia y di anochi, huntu cu e dokter, e psiquiatra, e ortopedagogo y e psicologonan di KIA, cu ta encarga di terapia, evaluacion di riesgo y apoyo den crisis. Cada un di e shete enfermeranan ta traha turno di dia y tambe di anochi; esey ta un condicion di e contrato. Di dia tin dos enfermera, di atardi y di anochi un. E dos opcionnan por bay huntu: B awor, mientras ta studia A." } },

/* 13 */ { k: "flow", t: {
  en: { eb: "Care flow", title: "One route to care, at every site, day and night", s: [["Need", "Detainee, staff or the intake screen flags a health need"], ["Nurse", "08–16: the site nurse evaluates. After hours: the duty officer calls the on-call nurse"], ["Physician", "On site or on call: phone advice, visit, prescription"], ["Outcome", "Treat on site, psychology or psychiatry, subcontracted care, HOH/IMSAN, ambulance"]], band: "Every step is recorded once in the electronic medical record and is visible at the next stop of the custody chain.", foot: "Ambulance criteria, referrals and waiting-time targets as in the June plan, sections 4.3–4.7." },
  es: { eb: "Ruta de atención", title: "Una sola ruta de atención, en cada sitio, de día y de noche", s: [["Necesidad", "El detenido, el personal o el tamizaje de ingreso detectan una necesidad"], ["Enfermería", "08–16: evalúa el enfermero del sitio. Fuera de horario: el oficial de turno llama al enfermero de guardia"], ["Médico", "En el sitio o de guardia: consejo telefónico, visita, receta"], ["Resultado", "Tratar en el sitio, psicología o psiquiatría, servicio subcontratado, HOH/IMSAN, ambulancia"]], band: "Cada paso se registra una sola vez en el expediente médico electrónico y se ve en la siguiente parada de la cadena de custodia.", foot: "Criterios de ambulancia, referencias y tiempos de espera según el plan de junio, secciones 4.3–4.7." },
  nl: { eb: "Zorgroute", title: "Eén zorgroute, op elke locatie, dag en nacht", s: [["Zorgvraag", "Gedetineerde, personeel of intakescreening signaleert een zorgvraag"], ["Verpleging", "08–16: de verpleegkundige ter plaatse beoordeelt. Daarna: de dienstdoende agent belt de verpleegkundige van dienst"], ["Arts", "Ter plaatse of op afstand: telefonisch advies, bezoek, recept"], ["Uitkomst", "Behandeling ter plaatse, psychologie of psychiatrie, uitbestede zorg, HOH/IMSAN, ambulance"]], band: "Elke stap wordt één keer vastgelegd in het elektronisch medisch dossier en is zichtbaar bij de volgende schakel in de justitiële keten.", foot: "Ambulancecriteria, verwijzingen en wachttijdnormen zoals in het plan van juni, paragrafen 4.3–4.7." },
  pap: { eb: "Ruta di cuido", title: "Un solo ruta di cuido, na cada sitio, dia y anochi", s: [["Necesidad", "E detenido, e personal of e screening di intake ta detecta un necesidad"], ["Enfermera", "08–16: e enfermera di sitio ta evalua. Despues di orario: e oficial di turno ta yama e enfermera di guardia"], ["Dokter", "Riba sitio of di guardia: conseho pa telefon, bishita, receta"], ["Resultado", "Trata riba sitio, psicologia of psiquiatria, servicio subcontrata, HOH/IMSAN, ambulancia"]], band: "Cada paso ta wordo registra un biaha den e expediente medico electronico y ta visibel den e siguiente parada di e cadena di custodia.", foot: "Criterio di ambulancia, referencia y tempo di espera segun e plan di juni, seccion 4.3–4.7." } },
 n: {
  en: "The clinical route from the June plan now applies to every institution. During working hours the nurse on site sees the patient first. After hours the duty officer calls the on-call nurse, who triages by phone and can escalate to the on-call physician or call an ambulance. The physician decides: advice, a visit, a prescription or a referral. What is new is that mental health and subcontracted care are part of the same department, so a referral to a psychologist, the psychiatrist, a dentist or a physiotherapist stays inside one system.",
  es: "La ruta clínica del plan de junio se aplica ahora a todas las instituciones. En horario de trabajo, el enfermero del sitio ve primero al paciente. Fuera de horario, el oficial de turno llama al enfermero de guardia, que clasifica por teléfono y puede escalar al médico de guardia o pedir una ambulancia. El médico decide: consejo, visita, receta o referencia. Lo nuevo es que la salud mental y los servicios subcontratados forman parte del mismo departamento, así que una referencia al psicólogo, a la psiquiatra, al dentista o al fisioterapeuta queda dentro de un solo sistema.",
  nl: "De zorgroute uit het plan van juni geldt nu voor elke instelling. Tijdens werktijd ziet de verpleegkundige ter plaatse de patiënt eerst. Daarna belt de dienstdoende agent de verpleegkundige van dienst, die telefonisch triageert en kan opschalen naar de arts van dienst of een ambulance kan bellen. De arts beslist: advies, een bezoek, een recept of een verwijzing. Nieuw is dat geestelijke gezondheidszorg en uitbestede zorg onder dezelfde dienst vallen, zodat een verwijzing naar een psycholoog, de psychiater, een tandarts of een fysiotherapeut binnen één systeem blijft.",
  pap: "E ruta clinico di e plan di juni ta aplica awor na tur institucion. Durante orario di trabou, e enfermera di sitio ta mira e pashent prome. Despues di orario, e oficial di turno ta yama e enfermera di guardia, cu ta clasifica pa telefon y por scala na e dokter di guardia of yama un ambulancia. E dokter ta dicidi: conseho, un bishita, un receta of un referencia. Loke ta nobo ta cu salud mental y e servicionan subcontrata ta parti di e mesun departamento, asina cu un referencia na un psicologo, e psiquiatra, un dentista of un fisioterapeuta ta keda den un solo sistema." } },

/* 14 */ { k: "commission", t: {
  en: { eb: "Community Case Commission", title: "Every difficult case gets a name, a plan and an owner", s: [["Signal", "From KPA, KIA, GNC, Slachtofferhulp or the community"], ["Screening", "Intake and file; urgent cases fast-tracked"], ["Review", "The commission meets on a fixed cycle"], ["Plan", "Individual plan and one case owner"], ["Follow-up", "Progress reviewed until the case is closed"]], ml: "Proposed members", m: "Head of the Medical Department (chair) · Psychiatrist · Psychologist · Addiction therapist · Orthopedagogue · Slachtofferhulp · Family Justice professional · Liaison of the referring institution", foot: "Meeting frequency, admission criteria and confidentiality rules go in the commission’s regulations [to define]." },
  es: { eb: "Comisión de Casos de la Comunidad", title: "Cada caso difícil recibe un nombre, un plan y un responsable", s: [["Señal", "Desde KPA, KIA, GNC, Slachtofferhulp o la comunidad"], ["Evaluación", "Ingreso y expediente; los urgentes van primero"], ["Revisión", "La comisión se reúne con una frecuencia fija"], ["Plan", "Plan individual y un responsable del caso"], ["Seguimiento", "Se revisa el avance hasta cerrar el caso"]], ml: "Miembros propuestos", m: "Jefe del Departamento Médico (preside) · Psiquiatra · Psicólogo · Terapeuta en adicciones · Ortopedagogo · Slachtofferhulp · Profesional de Justicia Familiar · Enlace de la institución que refiere", foot: "Frecuencia de reuniones, criterios de admisión y reglas de confidencialidad van en el reglamento de la comisión [por definir]." },
  nl: { eb: "Commissie Casussen uit de Gemeenschap", title: "Elke moeilijke casus krijgt een naam, een plan en een eigenaar", s: [["Signaal", "Vanuit KPA, KIA, GNC, Slachtofferhulp of de gemeenschap"], ["Screening", "Intake en dossier; spoedgevallen eerst"], ["Bespreking", "De commissie vergadert volgens een vast schema"], ["Plan", "Individueel plan en één casushouder"], ["Opvolging", "Voortgang gevolgd tot de casus is afgesloten"]], ml: "Voorgestelde leden", m: "Hoofd Medische Dienst (voorzitter) · Psychiater · Psycholoog · Verslavingstherapeut · Orthopedagoog · Slachtofferhulp · Professional van Familiejustitie · Contactpersoon van de verwijzende instelling", foot: "Vergaderfrequentie, toelatingscriteria en geheimhoudingsregels komen in het reglement van de commissie [nader te bepalen]." },
  pap: { eb: "Comision di Casonan di Comunidad", title: "Cada caso dificil ta haya un nomber, un plan y un responsabel", s: [["Señal", "For di KPA, KIA, GNC, Slachtofferhulp of comunidad"], ["Evaluacion", "Intake y expediente; e urgentenan ta bay prome"], ["Revision", "E comision ta reuni cu un frecuencia fiho"], ["Plan", "Plan individual y un responsabel di e caso"], ["Seguimento", "Ta revisa e progreso te ora e caso sera"]], ml: "Miembronan proponi", m: "Hefe di Departamento Medico (presidente) · Psiquiatra · Psicologo · Terapista di adiccion · Ortopedagogo · Slachtofferhulp · Profesional di Hustisia Familiar · Enlace di e institucion cu ta refera", foot: "Frecuencia di reunion, criterio di admision y reglanan di confidencialidad ta bay den e reglamento di e comision [pa defini]." } },
 n: {
  en: "The commission is the new instrument the umbrella makes possible. Problem cases from the community and from the institutions arrive at one table. Each case is screened, discussed by a multidisciplinary group, gets an individual plan and one owner who makes sure the person receives the care they need, and is followed until it is closed. The regulations still need to be written, including how often the commission meets and how medical confidentiality is protected.",
  es: "La comisión es el instrumento nuevo que el techo hace posible. Los casos problemáticos de la comunidad y de las instituciones llegan a una sola mesa. Cada caso se evalúa, lo discute un grupo multidisciplinario, recibe un plan individual y un responsable que asegura que la persona reciba la atención que necesita, y se sigue hasta cerrarlo. Falta escribir el reglamento, incluida la frecuencia de las reuniones y cómo se protege la confidencialidad médica.",
  nl: "De commissie is het nieuwe instrument dat het overkoepelende dak mogelijk maakt. Complexe casussen uit de gemeenschap en uit de instellingen komen aan één tafel. Elke casus wordt gescreend, besproken door een multidisciplinaire groep, krijgt een individueel plan en één eigenaar die zorgt dat de persoon de juiste zorg krijgt, en wordt gevolgd tot hij is afgesloten. Het reglement moet nog worden geschreven, ook hoe vaak de commissie vergadert en hoe het medisch beroepsgeheim wordt beschermd.",
  pap: "E comision ta e instrumento nobo cu e dak ta haci posibel. E casonan problematico di comunidad y di e institucionnan ta yega na un solo mesa. Cada caso ta wordo evalua, un grupo multidisciplinario ta discutie, e ta haya un plan individual y un responsabel cu ta asegura cu e persona ta haya e cuido cu e mester, y ta sigui e te ora e sera. Ainda mester skirbi e reglamento, incluyendo cada cuanto e comision ta reuni y con ta proteha e confidencialidad medico." } },

/* 15 */ { k: "records", t: {
  en: { eb: "Electronic medical records", title: "One record that follows the person through the justice chain", ch: [["Arrest", "KPA station intake"], ["Detention", "KIA or GNC see the history"], ["Care", "Prescriptions, referrals, psychology"], ["Exit", "Release, transfer or deportation"]], c1: ["Why it matters", ["Lower cost: no repeated histories, tests or avoidable transfers", "Continuity: the next institution sees what the last one did", "Indicators and IVA reports come out automatically"]], c2: ["What the system must offer", ["Built for custody: cell, status, transfers, pre-deportation clearance", "Medical data kept apart from custodial data, access by role", "4 languages, encryption, backups, data location set by the Ministry", "Access from Microsoft Surface with MiFi for the on-call team"]], foot: "The choice of platform is a Ministry decision. It should be treated as a core element of the plan, like staffing." },
  es: { eb: "Expediente médico electrónico", title: "Un solo expediente que acompaña a la persona por toda la cadena de justicia", ch: [["Arresto", "Ingreso en la estación de KPA"], ["Detención", "KIA o GNC ven el historial"], ["Atención", "Recetas, referencias, psicología"], ["Salida", "Libertad, traslado o deportación"]], c1: ["Por qué importa", ["Menor costo: sin historias, exámenes ni traslados repetidos", "Continuidad: la siguiente institución ve lo que hizo la anterior", "Indicadores e informes IVA salen automáticamente"]], c2: ["Qué debe ofrecer el sistema", ["Hecho para custodia: celda, estatus, traslados, evaluación antes de deportar", "Datos médicos separados de los de custodia, acceso por rol", "4 idiomas, cifrado, respaldos, ubicación de datos fijada por el Ministerio", "Acceso desde Microsoft Surface con MiFi para el equipo de guardia"]], foot: "La elección de la plataforma es una decisión del Ministerio. Debe tratarse como un elemento central del plan, igual que el personal." },
  nl: { eb: "Elektronisch medisch dossier", title: "Eén dossier dat de persoon volgt door de hele justitiële keten", ch: [["Arrestatie", "Intake op het politiebureau"], ["Detentie", "KIA of GNC ziet de voorgeschiedenis"], ["Zorg", "Recepten, verwijzingen, psychologie"], ["Vertrek", "Vrijlating, overplaatsing of uitzetting"]], c1: ["Waarom het telt", ["Lagere kosten: geen dubbele anamneses, onderzoeken of vermijdbare overplaatsingen", "Continuïteit: de volgende instelling ziet wat de vorige deed", "Indicatoren en IVA-rapportages komen er automatisch uit"]], c2: ["Wat het systeem moet bieden", ["Gemaakt voor detentie: cel, status, overplaatsingen, medische vrijgave", "Medische gegevens gescheiden van detentiegegevens, toegang per rol", "4 talen, versleuteling, back-ups, opslaglocatie bepaald door het ministerie", "Toegang via Microsoft Surface met MiFi voor het team van dienst"]], foot: "De keuze van het systeem is een besluit van het ministerie. Het hoort tot de kern van het plan, net als het personeel." },
  pap: { eb: "Expediente medico electronico", title: "Un solo expediente cu ta acompaña e persona den henter e cadena di hustisia", ch: [["Arresto", "Intake na estacion di KPA"], ["Detencion", "KIA of GNC ta mira e historial"], ["Cuido", "Receta, referencia, psicologia"], ["Salida", "Libertad, traslado of deportacion"]], c1: ["Pakiko e ta importante", ["Menos gasto: sin historia, examen ni traslado ripiti", "Continuidad: e siguiente institucion ta mira loke esun anterior a haci", "Indicador y informe pa IVA ta sali automaticamente"]], c2: ["Kico e sistema mester ofrece", ["Traha pa custodia: sel, status, traslado, evaluacion promer cu deportacion", "Dato medico separa di dato di custodia, acceso segun rol", "4 idioma, cifrado, respaldo, ubicacion di dato fiha pa Ministerio", "Acceso via Microsoft Surface cu MiFi pa e equipo di guardia"]], foot: "E scogencia di e plataforma ta un decision di Ministerio. Mester trat'e como un elemento central di e plan, igual cu e personal." } },
 n: {
  en: "Automating the medical services with an electronic medical record is one of the highest-value investments in this plan. A detainee can pass through a police station, Guarda Nos Costa, the prison and the hospital in a few weeks. With one record, each step sees what the last one did: no repeated histories, no duplicated tests, fewer avoidable transfers. The system must be built for custody, keep medical data apart from custodial data, and meet the security conditions the Ministry sets. Which platform to use is a decision for the Ministry.",
  es: "Automatizar los servicios médicos con un expediente electrónico es una de las inversiones de mayor valor de este plan. Un detenido puede pasar por una estación de policía, Guarda Nos Costa, la prisión y el hospital en pocas semanas. Con un solo expediente, cada paso ve lo que hizo el anterior: sin historias repetidas, sin exámenes duplicados y con menos traslados evitables. El sistema debe estar hecho para la custodia, separar los datos médicos de los de custodia y cumplir las condiciones de seguridad que fije el Ministerio. Qué plataforma usar es una decisión del Ministerio.",
  nl: "Het automatiseren van de medische zorg met een elektronisch dossier is een van de waardevolste investeringen in dit plan. Een gedetineerde kan in een paar weken een politiebureau, Guarda Nos Costa, de gevangenis en het ziekenhuis passeren. Met één dossier ziet elke stap wat de vorige deed: geen dubbele anamneses, geen dubbele onderzoeken en minder vermijdbare overplaatsingen. Het systeem moet gemaakt zijn voor detentie, medische gegevens gescheiden houden van detentiegegevens en voldoen aan de veiligheidseisen van het ministerie. Welk systeem wordt gebruikt, beslist het ministerie.",
  pap: "Automatisa e servicionan medico cu un expediente electronico ta un di e inversionnan di mas balor di e plan aki. Un detenido por pasa door di un estacion di polis, Guarda Nos Costa, e prizon y e hospital den algun siman. Cu un solo expediente, cada paso ta mira loke esun anterior a haci: sin historia ripiti, sin examen duplica y cu menos traslado evitabel. E sistema mester ta traha pa custodia, tene e datonan medico separa di e datonan di custodia y cumpli cu e condicionnan di seguridad cu Ministerio ta pone. Cua plataforma usa ta un decision di Ministerio." } },

/* 16 */ { k: "money", t: {
  en: { eb: "Who pays what", title: "The Central Service pays for people; institutions pay for their sites", L: ["Central Service budget", ["All salaries, including shift and on-call allowances", "Continuing education of all staff", "Basic tools: psychological tests, stethoscopes, otoscopes, thermometers, oximeters", "3 cars: Head, psychiatrist, on-call psychologist", "4 on-call phones: physician, nurse, psychologist, psychiatrist", "4 Microsoft Surface with MiFi for the on-call team", "Phone allowance (telefoontoelage) for all other staff", "Administration: 2 staff for budget, procurement, HR", "Contracting of external providers", "Electronic records [cost split to confirm]"]], R: ["Each receiving institution", ["Offices, building and office supplies", "Medical devices: ECG, AED, electrocautery, beds, fridges", "Referrals: hospital (HOH), IMSAN, specialists, dentists and other medical providers", "Medication: KIA pays its own; KPA and GNC, decision pending", "KPA: 2 cars for the on-call physician and nurse", "Weekly fuel vouchers"]], foot: "One MoU per institution: KIA, KPA, GNC and every institution that joins. Priced budget within 30 days of approval." },
  es: { eb: "Quién paga qué", title: "El Servicio Central paga al personal; las instituciones pagan sus sitios", L: ["Presupuesto del Servicio Central", ["Todos los salarios, con turnos y guardias", "Educación continua de todo el personal", "Material básico: tests psicológicos, estetoscopios, otoscopios, termómetros, oxímetros", "3 autos: jefe, psiquiatra, psicólogo de guardia", "4 teléfonos de guardia: médico, enfermero, psicólogo, psiquiatra", "4 Microsoft Surface con MiFi para el equipo de guardia", "Asignación de teléfono (telefoontoelage) para el resto del personal", "Administración: 2 personas para presupuesto, compras, RR. HH.", "Contratación de proveedores externos", "Expediente electrónico [reparto por confirmar]"]], R: ["Cada institución que recibe el servicio", ["Oficinas, edificio e insumos de oficina", "Aparatos: ECG, DEA, electrocauterio, camillas, neveras", "Referencias: hospital (HOH), IMSAN, especialistas, dentistas y otros profesionales médicos", "Medicamentos: KIA paga los suyos; KPA y GNC, decisión pendiente", "KPA: 2 autos para médico y enfermero de guardia", "Bonos de gasolina semanales"]], foot: "Un MoU por institución: KIA, KPA, GNC y cada institución que se sume. Presupuesto con precios a los 30 días de la aprobación." },
  nl: { eb: "Wie betaalt wat", title: "De Centrale Dienst betaalt de mensen; de instellingen hun locaties", L: ["Budget Centrale Dienst", ["Alle salarissen, inclusief toelagen voor diensten en bereikbaarheid", "Bij- en nascholing van al het personeel", "Basismateriaal: psychologische tests, stethoscopen, otoscopen, thermometers, saturatiemeters", "3 auto's: hoofd, psychiater, psycholoog van dienst", "4 dienstelefoons: arts, verpleegkundige, psycholoog, psychiater", "4 Microsoft Surface met MiFi voor het team van dienst", "Telefoontoelage voor alle andere medewerkers", "Administratie: 2 medewerkers voor budget, inkoop, P&O", "Inkoop van externe zorgverleners", "Elektronisch dossier [kostenverdeling te bevestigen]"]], R: ["Elke ontvangende instelling", ["Kantoren, gebouw en kantoorartikelen", "Medische apparatuur: ecg, AED, elektrocauter, onderzoeksbanken, koelkasten", "Verwijzingen: ziekenhuis (HOH), IMSAN, specialisten, tandartsen en andere zorgverleners", "Medicatie: KIA betaalt zelf; KPA en GNC, besluit nodig", "KPA: 2 auto's voor arts en verpleegkundige van dienst", "Wekelijkse brandstofbonnen"]], foot: "Eén MoU per instelling: KIA, KPA, GNC en elke instelling die aansluit. Begroting met prijzen binnen 30 dagen na goedkeuring." },
  pap: { eb: "Ken ta paga kiko", title: "E Servicio Central ta paga e personal; e institucionnan ta paga nan sitio", L: ["Presupuesto di Servicio Central", ["Tur salario, cu turno y guardia", "Educacion continuo di tur personal", "Material basico: test psicologico, stetoscopio, otoscopio, termometro, oximetro", "3 auto: hefe, psiquiatra, psicologo di guardia", "4 telefon di guardia: dokter, enfermera, psicologo, psiquiatra", "4 Microsoft Surface cu MiFi pa e equipo di guardia", "Telefoontoelage pa e resto di personal", "Administracion: 2 persona pa presupuesto, compra, Recurso Humano", "Contratacion di proveedor di pafo", "Expediente electronico [reparticion pa confirma]"]], R: ["Cada institucion cu ta ricibi e servicio", ["Oficina, edificio y material di oficina", "Aparato: ECG, AED, electrocauterio, cama di examen, ijskast", "Referencia: hospital (HOH), IMSAN, especialista, dentista y otro profesional medico", "Remedi: KIA ta paga su mes; KPA y GNC, decision pendiente", "KPA: 2 auto pa dokter y enfermera di guardia", "Bono di gasolin tur siman"]], foot: "Un MoU pa institucion: KIA, KPA, GNC y cada institucion cu uni. Presupuesto cu prijs den 30 dia despues di aprobacion." } },
 n: {
  en: "The rule is simple. The Central Service pays for its people, their training, the medical equipment they carry, three cars for the Head, the psychiatrist and the on-call psychologist, four on-call phones, four Microsoft Surface devices with MiFi, a phone allowance for the rest of the staff, and its own administration unit. Each institution pays for the place where care is given and the equipment that stays there: offices, ECG machines, defibrillators, and every referral to the hospital, IMSAN, specialists, dentists or other medical providers. KIA pays its own medication; who pays for the medication of the police and Guarda Nos Costa is a decision we bring to you on the next slide. For the police that includes the two on-call cars and the weekly fuel vouchers. A fully priced budget follows within thirty days of approval.",
  es: "La regla es simple. El Servicio Central paga a su personal, su formación, los equipos médicos que llevan, tres autos para el jefe, la psiquiatra y el psicólogo de guardia, cuatro teléfonos de guardia, cuatro Microsoft Surface con MiFi, una asignación de teléfono para el resto del personal y su propia unidad de administración. Cada institución paga el lugar donde se da la atención y los equipos que quedan allí: oficinas, electrocardiógrafos, desfibriladores y todas las referencias al hospital, a IMSAN, a especialistas, a dentistas o a otros profesionales médicos. KIA paga sus propios medicamentos; quién paga los de la policía y Guarda Nos Costa es una decisión que le presentamos en la siguiente diapositiva. En la policía eso incluye los dos autos de guardia y los bonos de gasolina semanales. El presupuesto con precios se entrega a los treinta días de la aprobación.",
  nl: "De regel is eenvoudig. De Centrale Dienst betaalt de eigen mensen, hun scholing, de medische apparatuur die zij meenemen, drie auto's voor het hoofd, de psychiater en de psycholoog van dienst, vier dienstelefoons, vier Microsoft Surfaces met MiFi, een telefoontoelage voor de andere medewerkers en een eigen afdeling administratie. Elke instelling betaalt de plek waar de zorg wordt gegeven en de apparatuur die daar blijft: kantoren, ecg-apparaten, defibrillatoren en elke verwijzing naar het ziekenhuis, IMSAN, specialisten, tandartsen of andere zorgverleners. KIA betaalt de eigen medicatie; wie de medicatie van de politie en Guarda Nos Costa betaalt, leggen we u voor op de volgende dia. Voor de politie horen daar de twee auto's voor de bereikbaarheidsdienst en de wekelijkse brandstofbonnen bij. Binnen dertig dagen na goedkeuring volgt een volledige begroting.",
  pap: "E regla ta simpel. E Servicio Central ta paga su personal, nan formacion, e aparatonan medico cu nan ta carga, tres auto pa e hefe, e psiquiatra y e psicologo di guardia, cuater telefon di guardia, cuater Microsoft Surface cu MiFi, un telefoontoelage pa e resto di personal y su mes unidad di administracion. Cada institucion ta paga e lugar unda ta duna e cuido y e aparatonan cu ta keda aya: oficina, electrocardiograma, desfibrilador y tur referencia na hospital, IMSAN, especialista, dentista of otro profesional medico. KIA ta paga su mes remedinan; ken ta paga esnan di polis y Guarda Nos Costa ta un decision cu nos ta presenta bo den e siguiente diapositiva. Pa polis esey ta inclui e dos auto di guardia y e bononan di gasolin tur siman. E presupuesto cu prijs ta sigui den trinta dia despues di aprobacion." } },

{ k: "meds", t: {
  en: { eb: "Medication · decision needed", title: "Who pays for medication at KPA and Guarda Nos Costa?", p: ["The problem", ["The Botica di Servicio pharmacies froze the KPA and GNC accounts because of irregular payments", "Guarda Nos Costa has no budget for medication", "Without medication, detainees cannot be treated on site and end up in hospital"]], o: [["Option A", "A budget line in each institution", "KPA and GNC each receive their own medication budget and pay the pharmacy on time"], ["Option B · proposed", "One budget in the Central Service", "Medication only: the Central Service orders and pays, and its administration guarantees on-time payment to the pharmacy"], ["Option C", "A Ministry medication fund", "One fund for the medication of every detainee, managed by the Central Service"]], band: "KIA keeps paying its own medication. Referrals to the hospital, IMSAN, specialists, dentists and other medical providers stay with each institution. In every option: settle the frozen accounts, agree fixed payment terms with the pharmacy and keep the annual review of the medication list.", foot: "Decision of the Minister. Until then, medication for KPA and GNC detainees has no secure source of payment." },
  es: { eb: "Medicamentos · decisión necesaria", title: "¿Quién paga los medicamentos de KPA y Guarda Nos Costa?", p: ["El problema", ["Las farmacias de Botica di Servicio paralizaron las cuentas de KPA y GNC por irregularidades en los pagos", "Guarda Nos Costa no tiene presupuesto para medicamentos", "Sin medicamentos, los detenidos no se pueden tratar en el sitio y terminan en el hospital"]], o: [["Opción A", "Una partida en cada institución", "KPA y GNC reciben cada una su presupuesto de medicamentos y pagan a la farmacia a tiempo"], ["Opción B · propuesta", "Un presupuesto en el Servicio Central", "Solo medicamentos: el Servicio Central pide y paga, y su administración garantiza el pago a tiempo a la farmacia"], ["Opción C", "Un fondo del Ministerio", "Un solo fondo para la medicación de todas las personas detenidas, que administra el Servicio Central"]], band: "KIA sigue pagando sus propios medicamentos. Las referencias al hospital, IMSAN, especialistas, dentistas y otros profesionales médicos siguen a cargo de cada institución. En cualquier opción: saldar las cuentas paralizadas, acordar plazos de pago fijos con la farmacia y mantener la revisión anual de la lista de medicamentos.", foot: "Decisión del Ministro. Mientras tanto, los medicamentos de los detenidos de KPA y GNC no tienen una fuente de pago segura." },
  nl: { eb: "Medicatie · besluit nodig", title: "Wie betaalt de medicatie voor KPA en Guarda Nos Costa?", p: ["Het probleem", ["De apotheken van Botica di Servicio hebben de rekeningen van KPA en GNC bevroren na onregelmatige betalingen", "Guarda Nos Costa heeft geen budget voor medicatie", "Zonder medicatie kunnen gedetineerden niet ter plaatse worden behandeld en belanden ze in het ziekenhuis"]], o: [["Optie A", "Een budgetpost per instelling", "KPA en GNC krijgen elk een eigen medicatiebudget en betalen de apotheek op tijd"], ["Optie B · voorstel", "Eén budget bij de Centrale Dienst", "Alleen medicatie: de Centrale Dienst bestelt en betaalt, en de administratie garandeert tijdige betaling aan de apotheek"], ["Optie C", "Een medicatiefonds van het ministerie", "Eén fonds voor de medicatie van alle gedetineerden, beheerd door de Centrale Dienst"]], band: "KIA blijft zelf de eigen medicatie betalen. Verwijzingen naar ziekenhuis, IMSAN, specialisten, tandartsen en andere zorgverleners blijven bij elke instelling. In elke optie: de bevroren rekeningen vereffenen, vaste betaaltermijnen met de apotheek afspreken en de jaarlijkse herziening van de medicatielijst behouden.", foot: "Besluit van de Minister. Tot die tijd heeft de medicatie voor gedetineerden van KPA en GNC geen zekere betaalbron." },
  pap: { eb: "Remedi · decision necesario", title: "Ken ta paga e remedinan di KPA y Guarda Nos Costa?", p: ["E problema", ["E boticanan di Botica di Servicio a para e cuentanan di KPA y GNC pa motibo di iregularidad den pago", "Guarda Nos Costa no tin presupuesto pa remedi", "Sin remedi, e detenidonan no por wordo trata riba sitio y nan ta terminá den hospital"]], o: [["Opcion A", "Un partida den cada institucion", "KPA y GNC cada un ta haya su presupuesto di remedi y ta paga e botica na tempo"], ["Opcion B · proposicion", "Un presupuesto den e Servicio Central", "Solamente remedi: e Servicio Central ta pidi y paga, y su administracion ta garantisa pago na tempo na e botica"], ["Opcion C", "Un fondo di remedi di Ministerio", "Un solo fondo pa e remedi di tur persona deteni, maneha pa e Servicio Central"]], band: "KIA ta sigui paga su mes remedinan. Referencia na hospital, IMSAN, especialista, dentista y otro profesional medico ta keda na cargo di cada institucion. Den cualkier opcion: paga e cuentanan para, palabra plazo di pago fiho cu e botica y mantene e revision anual di e lista di remedi.", foot: "Decision di Minister. Mientras tanto, e remedinan di e detenidonan di KPA y GNC no tin un fuente di pago sigur." } },
 n: {
  en: "One point needs your decision now. KIA keeps paying for its own medication; the question is the police and Guarda Nos Costa. Because of irregular payments, the Botica di Servicio pharmacies have frozen the accounts of the police and Guarda Nos Costa, and Guarda Nos Costa has no budget for medication at all. Without medication, detainees cannot be treated on site and end up in hospital, which costs more. There are three ways to solve it: a medication budget in each institution, one budget in the Central Service, or one Ministry fund managed by the Central Service. We propose option B: medication for the police and Guarda Nos Costa falls on the Central Service budget, and its administration guarantees that the pharmacy is paid on time. This covers medication only: referrals to the hospital, IMSAN, specialists, dentists and other medical providers remain the responsibility of each institution. In every option the frozen accounts must be settled and payment terms with the pharmacy fixed.",
  es: "Hay un punto que necesita su decisión ya. KIA sigue pagando sus propios medicamentos; la pregunta es la policía y Guarda Nos Costa. Por irregularidades en los pagos, las farmacias de Botica di Servicio paralizaron las cuentas de la policía y de Guarda Nos Costa, y Guarda Nos Costa no tiene ningún presupuesto para medicamentos. Sin medicamentos, los detenidos no se pueden tratar en el sitio y terminan en el hospital, lo que cuesta más. Hay tres formas de resolverlo: un presupuesto de medicamentos en cada institución, un solo presupuesto en el Servicio Central, o un fondo del Ministerio que administra el Servicio Central. Proponemos la opción B: los medicamentos de la policía y de Guarda Nos Costa recaen sobre el presupuesto del Servicio Central, y su administración garantiza que la farmacia cobre a tiempo. Esto cubre solo los medicamentos: las referencias al hospital, a IMSAN, a especialistas, a dentistas y a otros profesionales médicos siguen a cargo de cada institución. En cualquier opción hay que saldar las cuentas paralizadas y fijar plazos de pago con la farmacia.",
  nl: "Eén punt vraagt nu uw besluit. KIA blijft de eigen medicatie betalen; het gaat om de politie en Guarda Nos Costa. Door onregelmatige betalingen hebben de apotheken van Botica di Servicio de rekeningen van de politie en Guarda Nos Costa bevroren, en Guarda Nos Costa heeft helemaal geen budget voor medicatie. Zonder medicatie kunnen gedetineerden niet ter plaatse worden behandeld en belanden ze in het ziekenhuis, wat meer kost. Er zijn drie oplossingen: een medicatiebudget per instelling, één budget bij de Centrale Dienst, of één fonds van het ministerie dat de Centrale Dienst beheert. Wij stellen optie B voor: de medicatie voor de politie en Guarda Nos Costa valt onder het budget van de Centrale Dienst, en de administratie garandeert dat de apotheek op tijd wordt betaald. Dit geldt alleen voor medicatie: verwijzingen naar het ziekenhuis, IMSAN, specialisten, tandartsen en andere zorgverleners blijven de verantwoordelijkheid van elke instelling. In elke optie moeten de bevroren rekeningen worden vereffend en vaste betaaltermijnen met de apotheek worden afgesproken.",
  pap: "Tin un punto cu mester di bo decision awor. KIA ta sigui paga su mes remedinan; e pregunta ta polis y Guarda Nos Costa. Pa motibo di iregularidad den pago, e boticanan di Botica di Servicio a para e cuentanan di polis y di Guarda Nos Costa, y Guarda Nos Costa no tin ningun presupuesto pa remedi. Sin remedi, e detenidonan no por wordo trata riba sitio y nan ta terminá den hospital, cu ta costa mas. Tin tres manera pa resolve esaki: un presupuesto di remedi den cada institucion, un solo presupuesto den e Servicio Central, of un fondo di Ministerio maneha pa e Servicio Central. Nos ta proponé opcion B: e remedinan di polis y di Guarda Nos Costa ta cai riba e presupuesto di e Servicio Central, y su administracion ta garantisa cu e botica ta cobra na tempo. Esaki ta cubri solamente remedi: referencia na hospital, IMSAN, especialista, dentista y otro profesional medico ta keda responsabilidad di cada institucion. Den cualkier opcion mester paga e cuentanan para y fiha plazo di pago cu e botica." } },

{ k: "admin", t: {
  en: { eb: "Administration", title: "Two administrative staff to run the Central Service", c: [["Budget and finance", ["Prepares and manages the annual budget", "Salaries, shift and on-call allowances", "Reports spending to the Ministry"]], ["Procurement and equipment", ["Buys the department’s own medical equipment and tests", "Keeps the inventory and the 3-year renewal cycle", "Runs phones, cars and fuel"]], ["People", ["HR and payroll for all staff", "Rosters, on-call weeks and leave", "Certifications and continuing education records"]], ["Contracts", ["MoUs with KIA, KPA, GNC and other institutions", "Contracts with subcontracted providers", "Invoices and cost recovery"]]], band: "Clinicians spend their time on patients, not on paperwork: one office handles money, purchasing and people for every site.", foot: "Two staff: one for budget and finance, one for procurement, HR and contracts [profiles to confirm with the Ministry]." },
  es: { eb: "Administración", title: "Dos personas de administración para el Servicio Central", c: [["Presupuesto y finanzas", ["Prepara y gestiona el presupuesto anual", "Salarios, turnos y guardias", "Informa del gasto al Ministerio"]], ["Compras y equipos", ["Compra los equipos médicos y tests propios del departamento", "Lleva el inventario y la renovación cada 3 años", "Administra teléfonos, autos y gasolina"]], ["Personal", ["RR. HH. y nómina de todo el personal", "Roles, semanas de guardia y vacaciones", "Certificaciones y registro de educación continua"]], ["Contratos", ["MoU con KIA, KPA, GNC y otras instituciones", "Contratos con proveedores subcontratados", "Facturas y recuperación de costos"]]], band: "Los clínicos dedican su tiempo a los pacientes, no al papeleo: una sola oficina maneja dinero, compras y personal para todos los sitios.", foot: "Dos personas: una para presupuesto y finanzas, otra para compras, RR. HH. y contratos [perfiles por confirmar con el Ministerio]." },
  nl: { eb: "Administratie", title: "Twee administratieve medewerkers voor de Centrale Dienst", c: [["Budget en financiën", ["Stelt de jaarbegroting op en beheert die", "Salarissen, toelagen voor diensten en bereikbaarheid", "Rapporteert de uitgaven aan het ministerie"]], ["Inkoop en apparatuur", ["Koopt de eigen medische apparatuur en tests van de dienst", "Beheert de voorraad en de vervanging elke 3 jaar", "Regelt telefoons, auto's en brandstof"]], ["Personeel", ["P&O en salarisadministratie voor alle medewerkers", "Roosters, bereikbaarheidsweken en verlof", "Certificaten en registratie van bij- en nascholing"]], ["Contracten", ["MoU's met KIA, KPA, GNC en andere instellingen", "Contracten met uitbestede zorgverleners", "Facturen en kostenverhaal"]]], band: "Zorgverleners besteden hun tijd aan patiënten, niet aan papierwerk: één kantoor regelt geld, inkoop en personeel voor alle locaties.", foot: "Twee medewerkers: één voor budget en financiën, één voor inkoop, P&O en contracten [profielen te bevestigen met het ministerie]." },
  pap: { eb: "Administracion", title: "Dos persona di administracion pa e Servicio Central", c: [["Presupuesto y finansa", ["Ta prepara y maneha e presupuesto anual", "Salario, turno y guardia", "Ta informa Ministerio di e gastonan"]], ["Compra y aparato", ["Ta cumpra e aparatonan medico y test propio di e departamento", "Ta tene e inventario y e renobacion cada 3 aña", "Ta administra telefon, auto y gasolin"]], ["Personal", ["Recurso Humano y pago di salario pa tur personal", "Rol, siman di guardia y vacacion", "Certificacion y registro di educacion continuo"]], ["Contrato", ["MoU cu KIA, KPA, GNC y otro institucion", "Contrato cu proveedor subcontrata", "Factura y recuperacion di gasto"]]], band: "E clinico ta dedica nan tempo na pashent, no na papel: un solo oficina ta maneha placa, compra y personal pa tur sitio.", foot: "Dos persona: un pa presupuesto y finansa, un pa compra, Recurso Humano y contrato [perfil pa confirma cu Ministerio]." } },
 n: {
  en: "To manage its own budget and buy its own medical equipment, the Central Service needs an administration unit. It prepares and manages the budget, pays salaries and allowances, buys and maintains the equipment and tests the institutions do not provide, runs the phones, cars and fuel, keeps rosters and certifications, and manages the agreements with each institution and with the subcontracted providers. This way the clinical staff spend their time on patients. The unit has two people: one for budget and finance, and one for procurement, personnel and contracts.",
  es: "Para manejar su propio presupuesto y comprar sus propios equipos médicos, el Servicio Central necesita una unidad de administración. Prepara y gestiona el presupuesto, paga salarios y guardias, compra y mantiene los equipos y tests que no aportan las instituciones, administra teléfonos, autos y gasolina, lleva los roles y las certificaciones, y gestiona los acuerdos con cada institución y con los proveedores subcontratados. Así el personal clínico dedica su tiempo a los pacientes. La unidad tiene dos personas: una para presupuesto y finanzas, y otra para compras, personal y contratos.",
  nl: "Om een eigen budget te beheren en eigen medische apparatuur te kopen, heeft de Centrale Dienst een afdeling administratie nodig. Die stelt de begroting op en beheert die, betaalt salarissen en toelagen, koopt en onderhoudt de apparatuur en tests die de instellingen niet leveren, regelt telefoons, auto's en brandstof, houdt roosters en certificaten bij en beheert de afspraken met elke instelling en met de uitbestede zorgverleners. Zo besteden de zorgverleners hun tijd aan patiënten. De afdeling bestaat uit twee mensen: één voor budget en financiën en één voor inkoop, personeel en contracten.",
  pap: "Pa maneha su mes presupuesto y cumpra su mes aparatonan medico, e Servicio Central mester di un unidad di administracion. E ta prepara y maneha e presupuesto, ta paga salario y guardia, ta cumpra y mantene e aparatonan y testnan cu e institucionnan no ta duna, ta administra telefon, auto y gasolin, ta tene e rolnan y certificacionnan, y ta maneha e acuerdonan cu cada institucion y cu e proveedornan subcontrata. Asina e personal clinico ta dedica nan tempo na e pashentnan. E unidad tin dos persona: un pa presupuesto y finansa, y un pa compra, personal y contrato." } },

/* 17 */ { k: "mobility", t: {
  en: { eb: "Mobility", title: "Cars, phones and devices for every site", c: [["All staff", "Travel to work with their own transport"], ["1 car · KIA", "Already assigned to the nurses on duty for KIA"], ["2 cars · KPA", "On-call physician and on-call nurse of the week"], ["3 cars · Central", "New: Head, psychiatrist and on-call psychologist. Owned by the Central Medical Department"]], phones: "<b>4 on-call phones</b> for the physician, the nurse, the psychologist and the psychiatrist on call, handed over with each weekly rotation. All other staff use their own mobile phone and receive a phone allowance (telefoontoelage).", devices: "<b>4 Microsoft Surface with MiFi</b> (laptop and tablet in one) for the on-call physician, nurse, psychologist and psychiatrist, to open the electronic medical record from any site.", band: "<b>Fuel vouchers every week</b>, delivered by the receiving institutions, so the service never stops for lack of fuel.", foot: "Fuel and maintenance of the 3 central cars from the Central Service budget [to confirm]." },
  es: { eb: "Movilidad", title: "Autos, teléfonos y equipos para cada sitio", c: [["Todo el personal", "Va al trabajo con su propio transporte"], ["1 auto · KIA", "Ya asignado a los enfermeros de guardia de KIA"], ["2 autos · KPA", "Médico y enfermero de guardia de la semana"], ["3 autos · Central", "Nuevos: jefe, psiquiatra y psicólogo de guardia. Del Departamento Médico Central"]], phones: "<b>4 teléfonos de guardia</b> para el médico, el enfermero, el psicólogo y la psiquiatra de guardia; pasan de mano en cada rotación semanal. El resto del personal usa su propio celular y recibe una asignación de teléfono (telefoontoelage).", devices: "<b>4 Microsoft Surface con MiFi</b> (laptop y tablet en uno) para el médico, el enfermero, el psicólogo y la psiquiatra de guardia, para abrir el expediente médico electrónico desde cualquier sitio.", band: "<b>Bonos de gasolina cada semana</b>, entregados por las instituciones que reciben el servicio, para que nunca se detenga por falta de combustible.", foot: "Gasolina y mantenimiento de los 3 autos centrales a cargo del Servicio Central [por confirmar]." },
  nl: { eb: "Mobiliteit", title: "Auto's, telefoons en apparatuur voor elke locatie", c: [["Al het personeel", "Reist met eigen vervoer naar het werk"], ["1 auto · KIA", "Al toegewezen aan de dienstdoende verpleegkundigen van KIA"], ["2 auto's · KPA", "Arts en verpleegkundige van dienst die week"], ["3 auto's · Centraal", "Nieuw: hoofd, psychiater en psycholoog van dienst. Eigendom van de Centrale Medische Dienst"]], phones: "<b>4 dienstelefoons</b> voor de arts, de verpleegkundige, de psycholoog en de psychiater van dienst; ze gaan mee met elke wekelijkse wissel. Alle andere medewerkers gebruiken hun eigen mobiel en krijgen een telefoontoelage.", devices: "<b>4 Microsoft Surface met MiFi</b> (laptop en tablet in één) voor de arts, de verpleegkundige, de psycholoog en de psychiater van dienst, om het elektronisch medisch dossier op elke locatie te openen.", band: "<b>Elke week brandstofbonnen</b>, geleverd door de ontvangende instellingen, zodat de dienst nooit stilvalt door gebrek aan brandstof.", foot: "Brandstof en onderhoud van de 3 centrale auto's uit het budget van de Centrale Dienst [te bevestigen]." },
  pap: { eb: "Mobilidad", title: "Auto, telefon y aparato pa cada sitio", c: [["Tur personal", "Ta bay trabou cu nan mes transporte"], ["1 auto · KIA", "Ya asigna na e enfermeranan di guardia di KIA"], ["2 auto · KPA", "Dokter y enfermera di guardia di e siman"], ["3 auto · Central", "Nobo: hefe, psiquiatra y psicologo di guardia. Di Departamento Medico Central"]], phones: "<b>4 telefon di guardia</b> pa e dokter, e enfermera, e psicologo y e psiquiatra di guardia; nan ta pasa di man cada rotacion semanal. E resto di personal ta usa nan mes celular y ta haya un telefoontoelage.", devices: "<b>4 Microsoft Surface cu MiFi</b> (laptop y tablet den un) pa e dokter, e enfermera, e psicologo y e psiquiatra di guardia, pa habri e expediente medico electronico for di cualkier sitio.", band: "<b>Bono di gasolin cada siman</b>, entrega pa e institucionnan cu ta ricibi e servicio, pa e servicio nunca para pa falta di gasolin.", foot: "Gasolin y mantenimento di e 3 auto central a cargo di Servicio Central [pa confirma]." } },
 n: {
  en: "Everyone comes to work in their own transport. KIA already has a car for the nurses on duty for the prison. The police assign two cars: one for the physician on call that week and one for the nurse on call. We also request three new cars that belong to the Central Medical Department: one for the Head and one for the psychiatrist, who move between institutions every day, and one for the psychologist on call. Each on-call role also has its own phone: the physician, the nurse, the psychologist and the psychiatrist. Everyone else works with their own mobile phone and receives a phone allowance. The on-call team also carries four Microsoft Surface devices with MiFi, laptop and tablet in one, so the physician, the nurse, the psychologist and the psychiatrist can open the electronic medical record wherever they are. The institutions hand over fuel vouchers every week; without them the on-call service cannot run.",
  es: "Cada persona viene al trabajo con su propio transporte. KIA ya tiene un auto para los enfermeros de guardia de la prisión. La policía asigna dos autos: uno para el médico de guardia de la semana y otro para el enfermero de guardia. Además pedimos tres autos nuevos que pertenecen al Departamento Médico Central: uno para el jefe y otro para la psiquiatra, que se mueven entre instituciones todos los días, y uno para el psicólogo de guardia. Cada guardia tiene además su propio teléfono: el médico, el enfermero, el psicólogo y la psiquiatra. El resto del personal trabaja con su propio celular y recibe una asignación de teléfono. El equipo de guardia lleva además cuatro Microsoft Surface con MiFi, que son laptop y tablet a la vez, para que el médico, el enfermero, el psicólogo y la psiquiatra abran el expediente médico electrónico dondequiera que estén. Las instituciones entregan bonos de gasolina cada semana; sin ellos la guardia no puede funcionar.",
  nl: "Iedereen komt met eigen vervoer naar het werk. KIA heeft al een auto voor de dienstdoende verpleegkundigen van de gevangenis. De politie stelt twee auto's beschikbaar: één voor de arts van dienst en één voor de verpleegkundige van dienst. Daarnaast vragen we drie nieuwe auto's die van de Centrale Medische Dienst zijn: één voor het hoofd en één voor de psychiater, die dagelijks tussen instellingen reizen, en één voor de psycholoog van dienst. Elke dienst heeft ook een eigen telefoon: de arts, de verpleegkundige, de psycholoog en de psychiater. Alle anderen werken met hun eigen mobiel en krijgen een telefoontoelage. Het team van dienst heeft ook vier Microsoft Surfaces met MiFi, laptop en tablet in één, zodat de arts, de verpleegkundige, de psycholoog en de psychiater het elektronisch medisch dossier overal kunnen openen. De instellingen leveren elke week brandstofbonnen; zonder die bonnen kan de bereikbaarheidsdienst niet draaien.",
  pap: "Cada persona ta bin traha cu su mes transporte. KIA tin un auto caba pa e enfermeranan di guardia di prizon. Polis ta asigna dos auto: un pa e dokter di guardia di e siman y un pa e enfermera di guardia. Ademas nos ta pidi tres auto nobo cu ta pertenece na Departamento Medico Central: un pa e hefe y un pa e psiquiatra, cu ta move entre institucionnan tur dia, y un pa e psicologo di guardia. Cada guardia tin tambe su mes telefon: e dokter, e enfermera, e psicologo y e psiquiatra. E resto di personal ta traha cu nan mes celular y ta haya un telefoontoelage. E equipo di guardia ta carga tambe cuater Microsoft Surface cu MiFi, cu ta laptop y tablet den un, pa e dokter, e enfermera, e psicologo y e psiquiatra por habri e expediente medico electronico unda cu nan ta. E institucionnan ta entrega bono di gasolin tur siman; sin nan e servicio di guardia no por funciona." } },

/* 18 */ { k: "edu", t: {
  en: { eb: "Quality", title: "Trained staff, one contracting point", A: ["Continuing education budget", ["BLS, ACLS, PHTLS and ATLS for physicians and nurses", "Forensic psychiatry training for the forensic unit", "Updates for psychology, addiction care and orthopedagogy", "Certifications tracked centrally; none may expire"]], B: ["Subcontracted services", ["Dentists, physiotherapists, optometrists and others", "Contracted by the Central Service for all institutions", "One price list, one quality standard", "Paid by the receiving institution"]] },
  es: { eb: "Calidad", title: "Personal formado, un solo punto de contratación", A: ["Presupuesto de educación continua", ["BLS, ACLS, PHTLS y ATLS para médicos y enfermeros", "Formación en psiquiatría forense para la unidad forense", "Actualización en psicología, adicciones y ortopedagogía", "Certificaciones controladas de forma central; ninguna puede vencer"]], B: ["Servicios subcontratados", ["Dentistas, fisioterapeutas, optometristas y otros", "Contratados por el Servicio Central para todas las instituciones", "Una sola lista de precios, un solo estándar de calidad", "A cargo de la institución que recibe el servicio"]] },
  nl: { eb: "Kwaliteit", title: "Geschoold personeel, één inkooppunt", A: ["Budget voor bij- en nascholing", ["BLS, ACLS, PHTLS en ATLS voor artsen en verpleegkundigen", "Scholing forensische psychiatrie voor de forensische afdeling", "Bijscholing psychologie, verslavingszorg en orthopedagogiek", "Certificaten centraal bijgehouden; geen enkel mag verlopen"]], B: ["Uitbestede zorg", ["Tandartsen, fysiotherapeuten, optometristen en anderen", "Ingekocht door de Centrale Dienst voor alle instellingen", "Eén prijslijst, één kwaliteitsnorm", "Betaald door de ontvangende instelling"]] },
  pap: { eb: "Calidad", title: "Personal forma, un solo punto di contratacion", A: ["Presupuesto di educacion continuo", ["BLS, ACLS, PHTLS y ATLS pa dokter y enfermera", "Formacion den psiquiatria forense pa e unidad forense", "Actualisacion den psicologia, adiccion y ortopedagogia", "Certificacionnan controla central; ningun no por vence"]], B: ["Servicio subcontrata", ["Dentista, fisioterapeuta, optometrista y otro", "Contrata pa e Servicio Central pa tur institucion", "Un solo lista di prijs, un solo norma di calidad", "Na cargo di e institucion cu ta ricibi e servicio"]] } },
 n: {
  en: "Two advantages of centralization. First, one education budget for everyone: the four life-support certifications for the clinical team, specific training for the forensic unit, and updates for the mental health professionals. No certification may expire. Second, one contracting point for dentists, physiotherapists, optometrists and other providers, so every institution gets the same conditions instead of negotiating alone.",
  es: "Dos ventajas de centralizar. Primero, un solo presupuesto de formación para todos: las cuatro certificaciones de soporte vital para el equipo clínico, formación específica para la unidad forense y actualización para los profesionales de salud mental. Ninguna certificación puede vencer. Segundo, un solo punto de contratación para dentistas, fisioterapeutas, optometristas y otros proveedores, así cada institución obtiene las mismas condiciones en lugar de negociar sola.",
  nl: "Twee voordelen van centralisatie. Ten eerste één scholingsbudget voor iedereen: de vier reanimatie- en traumacertificaten voor het medische team, specifieke scholing voor de forensische afdeling en bijscholing voor de professionals in de geestelijke gezondheidszorg. Geen certificaat mag verlopen. Ten tweede één inkooppunt voor tandartsen, fysiotherapeuten, optometristen en andere zorgverleners, zodat elke instelling dezelfde voorwaarden krijgt in plaats van alleen te onderhandelen.",
  pap: "Dos bentaha di centralisa. Prome, un solo presupuesto di formacion pa tur hende: e cuater certificacion di soporte vital pa e equipo clinico, formacion specifico pa e unidad forense y actualisacion pa e profesionalnan di salud mental. Ningun certificacion no por vence. Di dos, un solo punto di contratacion pa dentista, fisioterapeuta, optometrista y otro proveedor, asina cada institucion ta haya e mesun condicion en bes di negocia so." } },

/* 19 */ { k: "table", w: [20, 13, 67], t: {
  en: { eb: "Implementation", title: "Twelve months, five phases", h: ["Phase", "When", "What happens"], r: [["0 · Decision", "Month 1", "Ministerial decision, name chosen, umbrella designated, 2 physicians appointed, vacancies opened, contact persons and deputies named"], ["1 · Foundation", "Months 2–3", "MoUs with KIA, KPA and GNC; KIA protocols adapted; records platform chosen; administration unit set up; 5 cars, 4 phones and 4 Microsoft Surface with MiFi assigned; recruitment"], ["2 · KIA and KPA", "Months 4–6", "KIA reinforced (nurses, psychologists, addiction care); KPA circuits and on-call week start"], ["3 · GNC and forensic", "Months 7–9", "GNC nurse in place; forensic unit staffed 24 hours, day and night, with the orthopedagogue; commission working"], ["4 · Review", "Months 10–12", "First indicator report; decision on 2 nurses per shift and on a forensic care institution"]], foot: "Medical attention at KPA can start in Phase 0 with the 2 physicians, 2 cars and 2 on-call phones, as in the June plan." },
  es: { eb: "Implementación", title: "Doce meses, cinco fases", h: ["Fase", "Cuándo", "Qué pasa"], r: [["0 · Decisión", "Mes 1", "Decisión ministerial, nombre elegido, techo designado, 2 médicos nombrados, vacantes abiertas, personas de contacto y suplentes designadas"], ["1 · Base", "Meses 2–3", "MoU con KIA, KPA y GNC; protocolos de KIA adaptados; plataforma de expediente elegida; unidad de administración creada; 5 autos, 4 teléfonos y 4 Microsoft Surface con MiFi asignados; reclutamiento"], ["2 · KIA y KPA", "Meses 4–6", "KIA reforzado (enfermería, psicología, adicciones); arrancan los circuitos de KPA y la guardia semanal"], ["3 · GNC y forense", "Meses 7–9", "Enfermero en GNC; unidad forense cubierta 24 horas, de día y de noche, con el ortopedagogo; comisión en marcha"], ["4 · Revisión", "Meses 10–12", "Primer informe de indicadores; decisión sobre 2 enfermeros por turno y una institución forense"]], foot: "La atención en KPA puede empezar en la Fase 0 con los 2 médicos, 2 autos y 2 teléfonos de guardia, como en el plan de junio." },
  nl: { eb: "Invoering", title: "Twaalf maanden, vijf fasen", h: ["Fase", "Wanneer", "Wat er gebeurt"], r: [["0 · Besluit", "Maand 1", "Ministerieel besluit, naam gekozen, overkoepelende afdeling aangewezen, 2 artsen benoemd, vacatures open, contactpersonen en vervangers aangewezen"], ["1 · Fundament", "Maand 2–3", "MoU's met KIA, KPA en GNC; protocollen van KIA aangepast; dossiersysteem gekozen; afdeling administratie opgezet; 5 auto's, 4 telefoons en 4 Microsoft Surface met MiFi toegewezen; werving"], ["2 · KIA en KPA", "Maand 4–6", "KIA versterkt (verpleging, psychologie, verslavingszorg); KPA-routes en wekelijkse bereikbaarheid starten"], ["3 · GNC en forensisch", "Maand 7–9", "Verpleegkundige bij GNC; forensische afdeling 24 uur bezet, dag en nacht, met de orthopedagoog; commissie actief"], ["4 · Evaluatie", "Maand 10–12", "Eerste indicatorenrapport; besluit over 2 verpleegkundigen per dienst en een forensische zorginstelling"]], foot: "Zorg bij KPA kan in fase 0 starten met de 2 artsen, 2 auto's en 2 telefoons voor de bereikbaarheidsdienst, zoals in het plan van juni." },
  pap: { eb: "Implementacion", title: "Diesdos luna, cinco fase", h: ["Fase", "Ki ora", "Kico ta pasa"], r: [["0 · Decision", "Luna 1", "Decision di Minister, nomber scogi, dak designa, 2 dokter nombra, vacatura habri, persona di contacto y suplente designa"], ["1 · Base", "Luna 2–3", "MoU cu KIA, KPA y GNC; protocolonan di KIA adapta; plataforma di expediente scogi; unidad di administracion establece; 5 auto, 4 telefon y 4 Microsoft Surface cu MiFi asigna; reclutamento"], ["2 · KIA y KPA", "Luna 4–6", "KIA reforsa (enfermeria, psicologia, adiccion); circuito di KPA y guardia semanal ta cuminsa"], ["3 · GNC y forense", "Luna 7–9", "Enfermera na GNC; unidad forense cubri 24 ora, di dia y di anochi, cu e ortopedagogo; comision ta traha"], ["4 · Evaluacion", "Luna 10–12", "Prome informe di indicador; decision tocante 2 enfermera pa turno y un institucion forense"]], foot: "Cuido na KPA por cuminsa den Fase 0 cu e 2 dokter, 2 auto y 2 telefon di guardia, manera den e plan di juni." } },
 n: {
  en: "The June roadmap, adapted to the larger scope. Phase zero is the decision and the appointments. Phase one lays the foundation: agreements with each institution, protocols, the choice of a records platform, the cars and recruitment. Phase two reinforces KIA and starts the police circuits and the on-call week. Phase three brings Guarda Nos Costa, the day and night shifts of the forensic unit and the commission online. Phase four measures results and decides the next steps. Each phase ends with a short written review for the Ministry.",
  es: "El plan de junio, adaptado al nuevo alcance. La fase cero es la decisión y los nombramientos. La fase uno pone la base: acuerdos con cada institución, protocolos, la elección de la plataforma de expediente, los autos y el reclutamiento. La fase dos refuerza KIA y arranca los circuitos de la policía y la guardia semanal. La fase tres incorpora Guarda Nos Costa, los turnos de día y de noche de la unidad forense y la comisión. La fase cuatro mide resultados y decide los próximos pasos. Cada fase termina con una breve revisión escrita para el Ministerio.",
  nl: "De planning van juni, aangepast aan de grotere opzet. Fase nul is het besluit en de benoemingen. Fase één legt het fundament: afspraken met elke instelling, protocollen, de keuze van een dossiersysteem, de auto's en de werving. Fase twee versterkt KIA en start de politieroutes en de wekelijkse bereikbaarheid. Fase drie brengt Guarda Nos Costa, de dag- en nachtdiensten van de forensische afdeling en de commissie op gang. Fase vier meet de resultaten en bepaalt de volgende stappen. Elke fase eindigt met een korte schriftelijke evaluatie voor het ministerie.",
  pap: "E plan di juni, adapta na e alcance nobo. Fase cero ta e decision y e nombramentonan. Fase un ta pone e base: acuerdo cu cada institucion, protocolo, e scogencia di un plataforma di expediente, e autonan y reclutamento. Fase dos ta reforsa KIA y ta cuminsa e circuitonan di polis y e guardia semanal. Fase tres ta trece Guarda Nos Costa, e turnonan di dia y di anochi di e unidad forense y e comision. Fase cuater ta midi resultado y ta dicidi e siguiente pasonan. Cada fase ta termina cu un evaluacion cortico por escrito pa Ministerio." } },
