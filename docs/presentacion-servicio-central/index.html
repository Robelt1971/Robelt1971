const LANGS = [["en", "EN"], ["es", "ES"], ["nl", "NL"], ["pap", "PAP"]];
/* Voice engine ported from DERR Medical System (src/services/ttsService.js): neural voices first,
   Papiamento read by the best Spanish voice, female voice for the presenter (opposite gender). */
const BCP = { en: "en-US", es: "es-ES", nl: "nl-NL", pap: "es-419" };
const VOICE_PRIORITY = {
  es: ["Microsoft Elena Online", "Microsoft Laura Online", "Microsoft Dalia Online", "Google español", "Google español de Estados Unidos", "Paulina", "Monica", "Jorge", "Diego"],
  en: ["Microsoft Jenny Online", "Microsoft Aria Online", "Microsoft Guy Online", "Google US English", "Google UK English Female", "Google UK English Male", "Samantha", "Daniel", "Karen", "Moira"],
  nl: ["Microsoft Colette Online", "Microsoft Fenna Online", "Google Nederlands", "Ellen", "Xander"]
};
const FEMALE_VOICE_NAMES = /\b(elena|laura|dalia|jenny|aria|zira|hazel|susan|fiona|moira|alice|anna|helena|ellen|nora|sara|lucia|conchita|monica|paulina|lupe|ines|joana|amelie|samantha|victoria|karen|tessa|claire|catherine|celine|colette|fenna|sabina|raquel|carmen|pilar|elvira|siri|cortana|female)\b/i;
const MALE_VOICE_NAMES = /\b(daniel|david|james|thomas|mark|jorge|pablo|enrique|carlos|diego|guy|reed|aaron|oliver|arthur|frank|rishi|jacques|andres|juan|pedro|liam|evan|fred|lee|tom|xander|male)\b/i;
const WANT_FEMALE = true; // presenter: Dr. Ernesto Rodriguez Robelt
const $ = (id) => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const hashLang = (location.hash || "").slice(1);
let lang = LANGS.some(([l]) => l === hashLang) ? hashLang : (LANGS.some(([l]) => l === store.get("jhs-lang")) ? store.get("jhs-lang") : "en");
let idx = 0, playing = false, auto = false, speakId = 0;
const synth = "speechSynthesis" in window ? window.speechSynthesis : null;

function bestVoice(l) {
  if (!synth) return null;
  const target = l === "pap" ? "es" : l, want = BCP[target], prefix = want.slice(0, 2);
  const score = (v) => {
    if (!v.lang.startsWith(prefix)) return -999;
    const n = v.name.toLowerCase(); let s = 0;
    if (n.includes("online") || n.includes("neural")) s += 80;
    if (n.includes("natural") || n.includes("premium")) s += 70;
    if (n.includes("enhanced")) s += 60;
    if (n.includes("google")) s += 40;
    if (n.includes("microsoft")) s += 30;
    if (n.includes("compact") || n.includes("espeak")) s -= 50;
    (VOICE_PRIORITY[target] || []).forEach((name, i) => { if (n.includes(name.toLowerCase())) s += 100 - i * 5; });
    const fem = FEMALE_VOICE_NAMES.test(v.name), male = MALE_VOICE_NAMES.test(v.name);
    if (WANT_FEMALE && fem) s += 40; if (!WANT_FEMALE && male) s += 40;
    if (WANT_FEMALE && male) s -= 30; if (!WANT_FEMALE && fem) s -= 30;
    if (v.lang === want) s += 15;
    return s;
  };
  return synth.getVoices().map((v) => [v, score(v)]).filter(([, s]) => s > -999).sort((a, b) => b[1] - a[1]).map(([v]) => v)[0] || null;
}
/* Recorded narration (Microsoft neural voices): audio/<lang>/<NN>.mp3. The browser voice is only a fallback. */
const clip = new Audio();
let fellBack = false;
function stopSpeech() { speakId++; playing = false; clip.pause(); if (synth) synth.cancel(); syncButtons(); }
function playRecorded(text, onEnd) {
  const id = ++speakId; let done = false;
  const finish = () => { if (done || id !== speakId) return; done = true; onEnd(); };
  const fallback = () => { if (done || id !== speakId) return; done = true; fellBack = true; updateWarn(); speak(text, onEnd); };
  if (synth) synth.cancel();
  clip.pause();
  clip.onended = finish; clip.onerror = fallback;
  clip.src = `audio/${lang}/${String(idx + 1).padStart(2, "0")}.mp3`;
  clip.play().catch(fallback);
}
function speak(text, onEnd) {
  if (!synth) { onEnd(); return; }
  synth.cancel();
  const id = ++speakId, voice = bestVoice(lang);
  const parts = text.replace(/([.!?;:])\s+/g, "$1\n").split("\n").map((s) => s.trim()).filter(Boolean);
  const next = () => { if (id !== speakId) return; const part = parts.shift(); if (!part) return onEnd();
    const u = new SpeechSynthesisUtterance(part); u.lang = BCP[lang]; u.rate = 0.95; u.pitch = 1.02; u.volume = 0.9; if (voice) u.voice = voice;
    u.onend = () => { if (id === speakId) setTimeout(next, 350); };
    u.onerror = () => { if (id === speakId) onEnd(); };
    synth.speak(u); };
  next();
}
function speakCurrent() {
  playing = true; syncButtons();
  playRecorded(S[idx].n[lang], () => {
    playing = false; syncButtons();
    if (auto && idx < S.length - 1) setTimeout(() => { if (auto) { idx++; render(); speakCurrent(); } }, 900);
    else if (auto) { auto = false; syncButtons(); }

}
function syncButtons() {

}
function render() {

  $("count").textContent = `${idx + 1} ${u.of} ${S.length}`;

function renderChrome() {
  const u = UI[lang];
  document.documentElement.lang = lang === "pap" ? "pap" : lang;
  $("ui-kicker").textContent = u.kicker; $("ui-title").textContent = u.title;
  $("prev").querySelector("span").textContent = u.prev; $("next").querySelector("span").textContent = u.next;
  $("full").querySelector("span").textContent = u.full; $("notes-h").textContent = u.notes;

function updateWarn() {

function setLang(l) {

}
function fit() {

  const maxH = fs ? window.innerHeight - 90 : Math.max(240, window.innerHeight - 150);

  stage.style.width = `${1600 * scale}px`; stage.style.height = `${900 * scale}px`; stage.style.justifySelf = "center";
  $("canvas").style.transform = `scale(${scale})`;
}

LANGS.forEach(([l, label]) => { const b = document.createElement("button"); b.type = "button"; b.dataset.l = l; b.textContent = label;
  b.addEventListener("click", () => setLang(l)); $("langs").appendChild(b); });
$("prev").addEventListener("click", () => go(idx - 1));
$("next").addEventListener("click", () => go(idx + 1));
$("play").addEventListener("click", () => { if (playing && !auto) stopSpeech(); else { auto = false; speakCurrent(); } });
$("auto").addEventListener("click", () => { if (auto) { auto = false; stopSpeech(); } else { auto = true; speakCurrent(); } });
$("full").addEventListener("click", () => { const p = $("player");
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else if (p.requestFullscreen) p.requestFullscreen().catch(() => {}); });
document.addEventListener("fullscreenchange", fit);
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(idx + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(idx - 1); }
  else if (e.key === "Home") go(0); else if (e.key === "End") go(S.length - 1);

let tx = null;
$("stage").addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
$("stage").addEventListener("touchend", (e) => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1)); });
if (synth) synth.addEventListener ? synth.addEventListener("voiceschanged", updateWarn) : (synth.onvoiceschanged = updateWarn);
new ResizeObserver(fit).observe(document.body);
window.addEventListener("resize", fit);
renderChrome(); render(); fit();
</script>
