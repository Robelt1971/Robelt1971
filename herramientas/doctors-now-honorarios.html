<title>Honorarios Doctors Now</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: hoja de comprobación — arriba lo que calculo contra lo que me pagaron; abajo un renglón por día con contadores. */
:root {
  --bg: #f3f6f6;
  --surface: #ffffff;
  --ink: #12302f;
  --muted: #5d7372;
  --line: #d6e1e0;
  --accent: #0b6e6c;
  --accent-soft: #dcefee;
  --proc: #7a4b9e;
  --proc-soft: #efe6f6;
  --ok: #1f7a3d;
  --ok-soft: #e1f3e6;
  --bad: #b03a1a;
  --bad-soft: #fbe7e1;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1716; --surface: #142221; --ink: #e2eeed; --muted: #8fa7a5; --line: #243937;
    --accent: #4fc2bd; --accent-soft: #1b3735; --proc: #c9a2e8; --proc-soft: #2c2236;
    --ok: #6fd08f; --ok-soft: #173322; --bad: #f29b7c; --bad-soft: #3a2018;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1716; --surface: #142221; --ink: #e2eeed; --muted: #8fa7a5; --line: #243937;
  --accent: #4fc2bd; --accent-soft: #1b3735; --proc: #c9a2e8; --proc-soft: #2c2236;
  --ok: #6fd08f; --ok-soft: #173322; --bad: #f29b7c; --bad-soft: #3a2018;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.05rem; font-weight: 700; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.status { font-size: 0.8rem; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }

.period-nav { display: flex; align-items: center; gap: 10px; }
.period-nav .label { flex: 1; min-width: 0; }
.period-nav .name { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; }
.period-nav .range { font-size: 0.85rem; color: var(--muted); }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 1.1rem; }
.icon-btn:disabled { opacity: 0.35; cursor: default; }

.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fig { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fig .big { font-family: var(--font-num); font-size: clamp(1.7rem, 7vw, 2.4rem); font-weight: 600; line-height: 1.1; color: var(--accent); }
.paid { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 4px 10px; }
.paid span { font-family: var(--font-num); font-size: 1.4rem; color: var(--muted); }
.paid input { width: 100%; min-width: 0; border: 0; background: transparent; color: var(--ink); font-family: var(--font-num); font-size: clamp(1.4rem, 6vw, 2rem); font-weight: 600; padding: 2px 0; }
.paid input:focus-visible { outline: none; }
.paid:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.verdict { border-radius: 10px; padding: 10px 12px; font-weight: 700; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict.wait { background: var(--bg); color: var(--muted); font-weight: 400; }

.ledger { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.ledger td { padding: 6px 0; border-top: 1px solid var(--line); }
.ledger td + td { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
.ledger tr.p td:first-child { color: var(--proc); }
.ledger tr.tot td { font-weight: 700; border-top: 2px solid var(--line); }

.days { display: flex; flex-direction: column; gap: 8px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.day.empty { background: transparent; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.day-head .d { font-weight: 700; }
.day-head .d small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.day-head .t { font-family: var(--font-num); font-weight: 600; }
.counters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.counter { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--bg); min-width: 0; }
.counter.on { border-color: var(--accent); background: var(--accent-soft); }
.counter.p.on { border-color: var(--proc); background: var(--proc-soft); }
.counter .n { font-size: 0.86rem; min-width: 0; }
.counter .n small { display: block; color: var(--muted); font-family: var(--font-num); font-size: 0.74rem; }
.stepper { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.stepper button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 1rem; }
.stepper button:disabled { opacity: 0.35; cursor: default; }
.stepper output { width: 24px; text-align: center; font-family: var(--font-num); font-weight: 600; }
.toggle-proc { align-self: flex-start; border: 1px dashed var(--proc); background: transparent; color: var(--proc); border-radius: 8px; padding: 4px 10px; font-size: 0.85rem; font-weight: 700; }
.procs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }

.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.hist { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.hist th { text-align: right; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 7px 10px; background: var(--bg); white-space: nowrap; }
.hist th:first-child, .hist td:first-child { text-align: left; }
.hist td { padding: 7px 10px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.hist td:first-child { font-family: var(--font-body); }
.hist tr.current td { background: var(--accent-soft); }
.hist .ok { color: var(--ok); font-weight: 600; }
.hist .bad { color: var(--bad); font-weight: 600; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }

details.settings summary { cursor: pointer; font-weight: 700; color: var(--muted); }
.prices { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin-top: 12px; }
.field { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 0.9rem; flex-wrap: wrap; }
.field input { width: 90px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 6px 8px; font-family: var(--font-num); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 700; margin-top: 12px; }
@media (max-width: 420px) { .counters { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .counter, .stepper button { transition: background .15s, border-color .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Doctors Now</div>
      <h1>Comprobación mensual</h1>
    </div>
    <span class="status" id="status">Cargando…</span>
  </header>

  <section class="card" aria-live="polite">
    <div class="period-nav">
      <button class="icon-btn" id="prev" aria-label="Período anterior">‹</button>
      <div class="label">
        <div class="name" id="pname">—</div>
        <div class="range" id="prange"></div>
      </div>
      <button class="icon-btn" id="next" aria-label="Período siguiente">›</button>
    </div>
    <div class="compare">
      <div class="fig"><span class="eyebrow">Lo que calculo</span><span class="big" id="ptotal">$0</span></div>
      <div class="fig"><label class="eyebrow" for="paid">Lo que me pagaron</label>
        <div class="paid"><span>$</span><input id="paid" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></div>
      </div>
    </div>
    <div class="verdict wait" id="verdict">Escribe lo que te pagaron para comparar.</div>
    <table class="ledger"><tbody id="pledger"></tbody></table>
  </section>

  <section class="days" id="days"></section>

  <section class="card">
    <h2>Meses anteriores</h2>
    <div class="tablebox">
      <table class="hist">
        <thead><tr><th>Período</th><th>Pacientes</th><th>Calculo</th><th>Me pagaron</th><th>Diferencia</th></tr></thead>
        <tbody id="histBody"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <details class="settings">
      <summary>Precios y período</summary>
      <div class="prices" id="priceFields"></div>
      <div class="field" style="justify-content:flex-start;margin-top:10px"><label for="startDay">El período empieza el día</label><input id="startDay" type="number" min="1" max="28" style="width:70px"><span class="status">25 = del 25 al 24 · 1 = mes calendario</span></div>
      <button class="btn" id="saveSettings">Guardar</button>
    </details>
  </section>
</div>

<script>
(() => {
  const KINDS = [
    { k: "online", name: "Teleconsultas", one: "teleconsulta", base: true },
    { k: "visita", name: "Visitas domiciliarias", one: "visita", base: true },
    { k: "oido", name: "Lavado de oído", one: "oído", many: "oídos", per: "por oído" },
    { k: "inyeccion", name: "Inyección", one: "inyección", many: "inyecciones", per: "por inyección" },
    { k: "herida", name: "Curación de herida", one: "curación", many: "curaciones", per: "por curación" },
    { k: "absceso", name: "Drenaje de absceso", one: "drenaje", many: "drenajes", per: "por drenaje" },
    { k: "sutura", name: "Sutura", one: "sutura", many: "suturas", per: "por sutura" },
  ];
  const PROC_KINDS = KINDS.filter(k => !k.base);
  const DEFAULT_PRICES = { online: 75, visita: 150, oido: 40, inyeccion: 40, herida: 50, absceso: 200, sutura: 150 };
  const MONTHS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  const WEEKDAYS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  const LS_KEY = "dn-comprobacion-v2";
  const LS_OLD = "dn-honorarios-v1";
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const money = n => (n < 0 ? "−$" : "$") + (Math.round(Math.abs(n) * 100) / 100).toLocaleString("en-US", { maximumFractionDigits: 2 });

  // ---- fechas ----
  const pad = n => String(n).padStart(2, "0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const todayIso = iso(new Date());
  function periodStart(dateIso, startDay) {
    const d = parseIso(dateIso);
    const s = new Date(d.getFullYear(), d.getMonth(), startDay);
    if (d.getDate() < startDay) s.setMonth(s.getMonth() - 1);
    return s;
  }
  function periodOf(s) { const e = new Date(s.getFullYear(), s.getMonth() + 1, s.getDate() - 1); return { start: iso(s), end: iso(e), s, e }; }
  const shift = (s, m) => new Date(s.getFullYear(), s.getMonth() + m, s.getDate());
  function periodName(p) {
    if (settings.startDay === 1) return `${MONTHS[p.s.getMonth()]} ${p.s.getFullYear()}`;
    return `${MONTHS[p.s.getMonth()]}/${MONTHS[p.e.getMonth()]} ${p.e.getFullYear()}`;
  }
  const fmtShort = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;

  // ---- estado ----
  let days = {};        // "YYYY-MM-DD" -> { online, visita, oido, ... }
  let pagos = {};       // inicio de período -> { pagado }
  let settings = { startDay: 25, prices: { ...DEFAULT_PRICES } };
  let viewStart = periodStart(todayIso, 25);
  let store = null;
  const open = new Set(); // días con procedimientos abiertos
  const pending = {}, timers = {};
  const price = k => Number(settings.prices[k] ?? DEFAULT_PRICES[k] ?? 0);
  const dayTotal = d => KINDS.reduce((a, k) => a + (d[k.k] || 0) * price(k.k), 0);
  const getDay = day => pending[day] || days[day] || {};

  function periodSums(p) {
    const c = {}; let total = 0, pacientes = 0;
    const all = new Set([...Object.keys(days), ...Object.keys(pending)]);
    for (const day of all) if (day >= p.start && day <= p.end) {
      const d = getDay(day);
      for (const k of KINDS) c[k.k] = (c[k.k] || 0) + (d[k.k] || 0);
      total += dayTotal(d); pacientes += (d.online || 0) + (d.visita || 0);
    }
    return { c, total, pacientes };
  }

  // ---- almacenamiento ----
  // Datos de la versión anterior (un registro por paciente) -> conteo por día.
  function daysFromOld(entries) {
    const out = {};
    for (const e of entries || []) {
      const d = out[e.fecha] = out[e.fecha] || {};
      let tipo = e.tipo, procs = e.procs || {};
      if (!tipo) {
        const m = Number(e.monto) || 0;
        tipo = m < 150 ? "online" : "visita"; procs = {};
        const rest = m - 150;
        if (tipo === "visita" && rest === 50) procs.herida = 1;
        else if (tipo === "visita" && rest === 200) procs.absceso = 1;
        else if (tipo === "visita" && rest > 0 && rest % 40 === 0) procs.inyeccion = rest / 40;
      }
      d[tipo] = (d[tipo] || 0) + 1;
      if (tipo !== "online") for (const k in procs) {
        const key = k === "p40" ? "inyeccion" : k;
        if (DEFAULT_PRICES[key] != null) d[key] = (d[key] || 0) + Number(procs[k] || 0);
      }
    }
    return out;
  }
  function localStore() {
    const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
    let data = read(LS_KEY);
    if (!data) {
      const old = read(LS_OLD);
      data = {
        days: old && old.entries ? daysFromOld(old.entries) : (window.DN_SEED_DAYS || {}),
        pagos: {},
        settings: old && old.settings && old.settings.prices ? { startDay: old.settings.startDay, prices: old.settings.prices } : null,
      };
      try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch {}
    }
    const write = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch {} };
    return {
      label: "Guardado en este navegador",
      start(onDays, onPagos, onSettings) { onDays({ ...data.days }); onPagos({ ...data.pagos }); onSettings(data.settings); },
      async saveDay(day, body) { if (isEmpty(body)) delete data.days[day]; else data.days[day] = body; days = { ...data.days }; write(); },
      async savePago(key, body) { if (body.pagado == null) delete data.pagos[key]; else data.pagos[key] = body; write(); },
      async saveSettings(s) { data.settings = s; write(); },
    };
  }
  function dbStore(db) {
    const dias = db.collection("dias"), pg = db.collection("pagos"), cfg = db.doc("ajustes/general");
    return {
      label: "Guardado en tu cuenta",
      start(onDays, onPagos, onSettings) {
        dias.onSnapshot(s => { const o = {}; s.docs.forEach(d => { o[d.id] = d.data(); }); onDays(o); }, e => showStatus("No se pudo leer: " + (e && e.code || "error")));
        pg.onSnapshot(s => { const o = {}; s.docs.forEach(d => { o[d.id] = d.data(); }); onPagos(o); }, () => {});
        cfg.onSnapshot(s => onSettings(s.exists ? s.data() : null), () => {});
      },
      async saveDay(day, body) { if (isEmpty(body)) await dias.doc(day).delete(); else await dias.doc(day).set(body); },
      async savePago(key, body) { if (body.pagado == null) await pg.doc(key).delete(); else await pg.doc(key).set(body); },
      async saveSettings(s) { await cfg.set(s); },
    };
  }
  const isEmpty = b => !KINDS.some(k => b[k.k] > 0);
  function showStatus(t) { $("status").textContent = t; }

  // Escrituras de un día: los toques seguidos se agrupan en una sola escritura.
  function queueDay(day) {
    clearTimeout(timers[day]);
    timers[day] = setTimeout(async () => {
      const body = { ...pending[day] };
      try { await store.saveDay(day, body); showStatus(store.label); }
      catch { showStatus("No se pudo guardar; revisa tu conexión"); return; }
      if (JSON.stringify(pending[day]) === JSON.stringify(body)) { delete pending[day]; days = { ...days }; if (isEmpty(body)) delete days[day]; else days[day] = body; }
    }, 700);
  }

  // ---- render ----
  function render() {
    const p = periodOf(viewStart);
    const sums = periodSums(p);
    $("pname").textContent = periodName(p);
    $("prange").textContent = `${fmtShort(p.s)} – ${fmtShort(p.e)} ${p.e.getFullYear()}`;
    $("ptotal").textContent = money(sums.total);
    $("next").disabled = p.start > todayIso;
    const paidInput = $("paid");
    const pago = pagos[p.start];
    if (document.activeElement !== paidInput) paidInput.value = pago && pago.pagado != null ? pago.pagado : "";
    renderVerdict(sums.total, pago && pago.pagado != null ? Number(pago.pagado) : null);

    const tb = $("pledger"); tb.replaceChildren();
    for (const k of KINDS) {
      const n = sums.c[k.k] || 0;
      if (!n && !k.base) continue;
      const tr = el("tr", k.base ? "" : "p");
      tr.append(el("td", null, k.name), el("td", null, `${n} × ${money(price(k.k))}`), el("td", null, money(n * price(k.k))));
      tb.append(tr);
    }
    const tot = el("tr", "tot");
    tot.append(el("td", null, `Total · ${sums.pacientes} pacientes`), el("td"), el("td", null, money(sums.total)));
    tb.append(tot);

    const box = $("days"); box.replaceChildren();
    const last = p.end < todayIso ? p.e : parseIso(todayIso);
    for (let d = new Date(last); d >= p.s; d.setDate(d.getDate() - 1)) box.append(dayRow(iso(d)));
    renderHistory();
  }

  function renderVerdict(total, paid) {
    const v = $("verdict");
    if (paid == null) { v.className = "verdict wait"; v.textContent = "Escribe lo que te pagaron para comparar."; return; }
    const diff = Math.round((paid - total) * 100) / 100;
    v.replaceChildren();
    if (diff === 0) { v.className = "verdict ok"; v.append(el("span", null, "Cuadra: te pagaron lo que calculaste."), el("span", "num", "✓")); }
    else if (diff < 0) { v.className = "verdict bad"; v.append(el("span", null, "Te pagaron menos de lo que calculaste"), el("span", "num", money(-diff))); }
    else { v.className = "verdict ok"; v.append(el("span", null, "Te pagaron más de lo que calculaste"), el("span", "num", "+" + money(diff))); }
  }

  function stepper(label, small, value, onChange, cls) {
    const box = el("div", "counter" + (cls ? " " + cls : "") + (value ? " on" : ""));
    const n = el("div", "n", label); if (small) n.append(el("small", null, small));
    const st = el("div", "stepper");
    const minus = el("button", null, "−"); minus.disabled = !value; minus.setAttribute("aria-label", "Quitar " + label);
    const out = el("output", null, String(value || 0));
    const plus = el("button", null, "+"); plus.setAttribute("aria-label", "Agregar " + label);
    minus.addEventListener("click", () => onChange(Math.max(0, (value || 0) - 1)));
    plus.addEventListener("click", () => onChange((value || 0) + 1));
    st.append(minus, out, plus); box.append(n, st);
    return box;
  }

  function dayRow(day) {
    const d = getDay(day);
    const dt = parseIso(day);
    const total = dayTotal(d);
    const pacientes = (d.online || 0) + (d.visita || 0);
    const row = el("article", "day" + (day === todayIso ? " today" : "") + (!total ? " empty" : ""));
    const head = el("div", "day-head");
    const name = el("div", "d", `${WEEKDAYS[dt.getDay()]} ${dt.getDate()} ${MONTHS[dt.getMonth()]}`);
    name.append(el("small", null, day === todayIso ? "hoy" : pacientes ? `${pacientes} paciente${pacientes > 1 ? "s" : ""}` : ""));
    head.append(name, el("div", "t", total ? money(total) : ""));
    row.append(head);

    const set = (k, v) => {
      const body = { ...getDay(day), [k]: v };
      for (const key in body) if (!body[key]) delete body[key];
      pending[day] = body; queueDay(day); render();
    };
    const main = el("div", "counters");
    for (const k of KINDS.filter(k => k.base)) main.append(stepper(k.name, money(price(k.k)), d[k.k], v => set(k.k, v)));
    row.append(main);

    const procCount = PROC_KINDS.reduce((a, k) => a + (d[k.k] || 0), 0);
    const isOpen = open.has(day);
    const label = isOpen ? "Ocultar procedimientos"
      : procCount ? `Procedimientos: ${PROC_KINDS.filter(k => d[k.k]).map(k => `${d[k.k]} ${d[k.k] > 1 ? k.many : k.one}`).join(", ")}` : "+ Procedimientos";
    const tg = el("button", "toggle-proc", label);
    tg.setAttribute("aria-expanded", isOpen ? "true" : "false");
    tg.addEventListener("click", () => { if (open.has(day)) open.delete(day); else open.add(day); render(); });
    row.append(tg);
    if (isOpen) {
      const grid = el("div", "procs");
      for (const k of PROC_KINDS) grid.append(stepper(k.name, `${money(price(k.k))} ${k.per}`, d[k.k], v => set(k.k, v), "p"));
      row.append(grid);
    }
    return row;
  }

  function renderHistory() {
    const tb = $("histBody"); tb.replaceChildren();
    const starts = new Set([...Object.keys(days), ...Object.keys(pending)].map(day => iso(periodStart(day, settings.startDay))));
    for (const k in pagos) starts.add(k);
    const viewing = periodOf(viewStart).start;
    const list = [...starts].sort().reverse();
    if (!list.length) { const tr = el("tr"); const td = el("td", null, "Todavía no hay días anotados."); td.colSpan = 5; tr.append(td); tb.append(tr); return; }
    for (const start of list) {
      const p = periodOf(parseIso(start));
      const s = periodSums(p);
      const pago = pagos[start] && pagos[start].pagado != null ? Number(pagos[start].pagado) : null;
      const tr = el("tr", start === viewing ? "current" : "");
      const name = el("td"); const b = el("button", "linkish", periodName(p));
      b.addEventListener("click", () => { viewStart = p.s; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
      name.append(b);
      const diff = pago == null ? null : Math.round((pago - s.total) * 100) / 100;
      tr.append(name, el("td", null, String(s.pacientes)), el("td", null, money(s.total)), el("td", null, pago == null ? "—" : money(pago)),
        el("td", diff == null ? "" : diff < 0 ? "bad" : "ok", diff == null ? "—" : diff === 0 ? "cuadra" : (diff > 0 ? "+" : "") + money(diff)));
      tb.append(tr);
    }
  }

  // ---- acciones ----
  $("prev").addEventListener("click", () => { viewStart = shift(viewStart, -1); render(); });
  $("next").addEventListener("click", () => { viewStart = shift(viewStart, 1); render(); });
  let paidTimer = null;
  $("paid").addEventListener("input", () => {
    const key = periodOf(viewStart).start;
    const raw = $("paid").value.trim();
    const body = { pagado: raw === "" ? null : Number(raw) };
    pagos = { ...pagos }; if (body.pagado == null) delete pagos[key]; else pagos[key] = body;
    renderVerdict(periodSums(periodOf(viewStart)).total, body.pagado); renderHistory();
    clearTimeout(paidTimer);
    paidTimer = setTimeout(() => store.savePago(key, body).catch(() => showStatus("No se pudo guardar el pago")), 700);
  });

  function fillSettings() {
    const box = $("priceFields"); box.replaceChildren();
    for (const k of KINDS) {
      const f = el("div", "field"); const lab = el("label", null, k.name); lab.htmlFor = "price-" + k.k;
      const inp = el("input"); inp.type = "number"; inp.min = "0"; inp.step = "any"; inp.id = "price-" + k.k; inp.value = price(k.k);
      f.append(lab, inp); box.append(f);
    }
    $("startDay").value = settings.startDay;
  }
  $("saveSettings").addEventListener("click", async () => {
    const prices = { ...settings.prices };
    for (const k of KINDS) { const v = Number($("price-" + k.k).value); if (v >= 0) prices[k.k] = v; }
    const sd = Math.min(28, Math.max(1, parseInt($("startDay").value, 10) || 25));
    applySettings({ startDay: sd, prices });
    try { await store.saveSettings(settings); showStatus("Precios guardados"); } catch { showStatus("No se pudieron guardar los precios"); }
  });
  function applySettings(s) {
    const prevSd = settings.startDay;
    settings = { startDay: Number(s && s.startDay) || 25, prices: { ...DEFAULT_PRICES, ...((s && s.prices) || {}) } };
    if (prevSd !== settings.startDay) viewStart = periodStart(todayIso, settings.startDay);
    fillSettings(); render();
  }

  async function boot() {
    let db = null;
    if (window.claude && typeof window.claude.use === "function") { try { db = await window.claude.use("db"); } catch { db = null; } }
    store = db ? dbStore(db) : localStore();
    showStatus(store.label);
    store.start(o => { days = o; render(); }, o => { pagos = o; render(); }, s => applySettings(s));
  }
  fillSettings(); render(); boot();
})();
</script>
